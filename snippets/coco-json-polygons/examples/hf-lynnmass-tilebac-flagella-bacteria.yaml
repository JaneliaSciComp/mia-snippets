labels:
  - snippet: coco-json-polygons
    urls: *images
    params: {categories: [bacteria]}
    pairs_with: 0
    label_key: manual_gt-bacteria-instance
    segmentation_type: instance
  - snippet: coco-json-polygons
    urls: *images
    params: {categories: [flagella]}
    pairs_with: 0
    label_key: manual_gt-flagella-instance
    segmentation_type: instance
reasons:
  - "raw: the 278 JPEGs of Annotated/COCO/4096/{test,train,valid} (31 + 219 + 28, the record's data.n_items 278) instead of the draft's one sample file. The Hugging Face repo has no HTTP directory index a glob could use (resolve/.../valid/ answers 404), so the files are listed one by one: the names are the `images[].file_name` of the three _annotations.coco.json files, and they equal the .jpg names of the three folders in the Hub's tree listing (huggingface.co/api/datasets/LynnMass/tilebac-flag-dataset/tree/main/Annotated/COCO/4096/<split>), 278 of 278. The record's sampled image valid/193_Camera-Falcon-1842-... is among them. Urls are in url order (test, train, valid; by name inside each)"
  - "raw with image-tiles-glob and samples: grey (from the draft, unchanged): the record says the RGB JPEGs hold 3 identical samples (technical.arrays[0].alignment_notes; imaging.channels 1), so the array is zyx 278 x 4096 x 4096 uint8. That was read on the record's sample JPEG only (the match report's smoke: shape 4096 x 4096, no errors): huggingface.co redirects every JPEG to us.aws.cdn.hf.co, a host the job that wrote this binding was not granted, so the other 277 JPEGs were not decoded for it. Their names, their number and the 4096 x 4096 size are the COCO files' and the Hub listing's; image-tiles-glob raises at read on a file whose samples differ or whose shape is not the first file's"
  - "only the 4096 folder is bound: by the record (technical.arrays[0].alignment_notes, notes) it is the Roboflow export without resize or augmentation, and the COCO files state 4096 x 4096 for all 278 images, the grid of the raw frames. The 1024-2x-train and 1024-3x-train folders hold the same images stretched to 1024 x 1024, their train splits as 2 or 3 augmented copies (flips, crop, rotation, shear, brightness), and Annotated/YOLO holds the same JPEGs again; binding them would repeat every image. The Raw/*.mrc files (role other) have no labels and are not bound"
  - "labels with coco-json-polygons, added for this dataset: the labels exist only as polygons, and no catalog snippet read COCO JSON (via-json-polygons reads VIA region files and needs a directory listing of the images). The label urls are the raw's urls (the YAML alias *images), so plane k of raw and labels is the same image by construction; the snippet finds each image's polygons in _annotations.coco.json of its own folder by file_name and draws them on the height and width that file states (4096 x 4096 for every image)"
  - "annotations param left at its default: each split folder holds its own _annotations.coco.json beside the images (the record's label path_pattern Annotated/COCO/*/*/_annotations.coco.json)"
  - "two labels, categories [bacteria] and [flagella], ids left at instance: the COCO categories are 1 bacteria and 2 flagella (record technical.arrays[1].classes; category 0 bacteria-flagella-I6pg is Roboflow's supercategory and has no annotation), and each annotation is one polygon around one cell or one flagellum, so a pixel holds the number of its object within its image. One array per class, as the match report names the labels: instance ids of both classes in one array would not say which id is a cell and which a flagellum. 429 of the 1236 annotations are bacteria and 807 flagella (train 347/657, valid 24/70, test 58/80), counted in the three files; the valid counts are the record's (24 bacteria, 70 flagella)"
  - "label_key manual_gt-bacteria-instance / manual_gt-flagella-instance and segmentation_type instance: the names the match report gives for these two classes; each id is one outlined object, and ids restart in every image"
  - "background planes: 3 test images have no annotation in their COCO file and are all background in both labels, and 53 images (train 36, valid 10, test 7) have flagella polygons only, so they are background planes in the bacteria label. COCO lists every image of a split, so an image without a polygon of a class is one where none was outlined; no image has bacteria only"
  - "the COCO polygons have 4 to 276 vertices with coordinates between 0 and 4096, no run-length masks and one ring per annotation (checked in all three files), so nothing is cut at the image edge or refused; in the valid split no bacteria polygon overlaps a flagella polygon"
