reasons:
  - "raw: 34 of the 36 training TIFFs of training_dataset.zip (files/45654198), one array each because their sizes differ (record shape_varies; the 36 are 2826 to 3040 rows by 2759 to 2953 columns), with tiff-zip-member-4 and no params as in the match agent's draft: each opens as yx float32, so no axis override. Every member is deflated, so each is fetched whole (10 to 13 MB)"
  - "two training images of the draft are left out, with their labels, for a human to decide: PXL_20220927_150744847.tif holds garbage in rows 622 to 625 (794 NaN and 3,562 values outside 0 to 255, up to 3.4e38 in magnitude, across the full width) and PXL_20220927_151312486.MP.tif in rows 296 to 298 (29 NaN, 2,977 such values); the rest of both images is finite, 0 to 255, and the members pass the zip's CRC, so the files were published this way. A crop that covers those rows would be stretched to their 1e38 values. Their ROI JSONs read like the others (102 and 63 outlines, on the cells of their images), so both pairs can be bound as the others are if those rows are acceptable"
  - "test_dataset.zip (69 TIFFs) is not bound: the record says test images have no ROIs"
  - "labels with roi-json-outlines-tiff-grid: each roi_jsons_combined/<stem>_ROI.json of Training_ROIs_json.zip (files/45654207) is a bare JSON list of {type, points [[x, y], ...]} with no image size, so each label's urls are the JSON and its TIFF again; the snippet takes the grid from the TIFF's first page header (the member the raw has already fetched, so it comes from the cache) and decodes none of its pixels. Each entry is filled with its 1-based position in the list as a uint16 instance id, 0 background"
