reasons:
  - "urls: only the record's technical.sample pair (section 0600), matching downloads.json scope sample-unit; the record gives the path_pattern and count (1168) but not the first file number, so the other slice URLs are not derivable without guessing, and both snippets take exactly one url per array"
  - "raw with tiff-zip-member on a plain https URL: a single-page YX uint8 TIFF, axes yx 1385x3394 from the file, matches the record; no axis override"
  - "labels with tiff-zip-member-class instead of tiff-zip-member: the label file is ONE semantic class-id map (uint8 ids 0-8, record technical.arrays) while downloads.json names one label per class; tiff-zip-member returns the whole map and segmentation_type binary encodes a != 0, so each per-class key would hold the union of all organelles. The same file is bound six times, once per class_id, each as a yx {0,1} mask"
  - "class_id 6 / 5 / 2 / 4 / 1 / 8 = endoplasmic reticulum / Golgi / lipid droplets / mitochondria / nuclear envelope / other unclassified objects: the record's classes (from the EMPIAR entry); the file does not name its ids"
  - "no entry for class ids 3 (lysosomes) and 7 (peroxisomes): downloads.json lists no label name for them, and neither occurs in the sampled slice (values {0,1,2,4,5,6,8})"
  - "label_key values are the six names in downloads.json labels, used exactly; provenance unknown because annotations.source is mixed"
  - "segmentation_type binary: each downloader label is one class's mask, and the snippet returns exactly that mask"
