reasons:
  - "ome-zarr2-http: the record's arrays are levels of OME-Zarr v2 stores (NGFF 0.4 multiscales, axes t c z y x, blosc chunks of one yx plane, '/' chunk keys) in an S3 bucket read over https; zarr2-http, the only other Zarr reader, has no time axis and does not read the multiscales scale"
  - "urls are the record's technical.sample.urls with '/0/.zarray' appended: the snippet takes a level array, not the group, level 0 is the full resolution the record describes, and the .zarray is an object with validators that `harness fetch` can fetch whole"
  - "two raw entries from the one raw store, one per channel, each with the label that was made from that channel: the cell segmentation from VE-cadherin mEGFP (channel 0), the label-free nuclear segmentation from bright-field (channel 1; 'label-free' = predicted from the transmitted-light image, the store has no nuclear stain). An earlier version of this binding paired both labels with the VE-cadherin image; the review found the nucleus outlines crossing the cell borders there. The nucleus label is not misplaced (same grid, scale and timepoint: flips, shifts of 10 px or more and earlier timepoints fit the cell segmentation worse (mean share of a nucleus inside one cell 0.79-0.82, 0.84-0.92 and 0.86 against 0.93 in place), its centroids are a median of about 1 px from the nuclei the validation store split the cells with, with no trend across the field, and its outlines lie on the nuclei seen in bright-field; a 4 px shift in x or a timepoint one or two later fits only marginally better, 0.93 -> 0.94), but 28% of its nuclei lie less than 95% inside one cell of the cell segmentation, and nuclei are not visible in the VE-cadherin channel, so that pair showed an annotation of something the image does not contain"
  - "t: 0 on all four: the harness has no time axis, so one timepoint is one array; the stores share the time axis (543 timepoints, 5 min, same scale), so the same t pairs them. t 0 is the timepoint at which the pairing below was checked bit for bit; other timepoints bind the same way, one pair of raw entries (each with its label) per t"
  - "raw 0, z_project: max and c: 0: the cell label is single-plane (z = 1) while the raw has 25 planes, and the dataset says the segmentation was made on the maximum intensity projection of channel 0 (omero: VE-cadherin_mEGFP): cdh5_seg_validations_zarr/<same name> names its channels VE-cadherin_mEGFP_maximum_intensity_projection, ..., VE-cadherin_mEGFP_segmentation_split_by_nuclei, ... Checked on this position: validation t 0 channel 0 equals the max over all 25 z planes of raw t 0 channel 0 in every pixel, and validation channel 6 equals cdh5_classic_seg t 0 in every pixel. No single raw plane is this label's plane"
  - "raw 1, c: 1 and z: 10: channel 1 is Brightfield (omero.channels), the channel the nuclei were predicted from. The nucleus label is single-plane and the dataset does not give it a raw plane; z 10 is the bright-field plane in focus at t 0, by the measure the dataset's in_focus_plane_annotations/<date>_<fileid>.parquet records per position (columns center_planes, center_plane_slice_std_devs): the plane with the lowest standard deviation, 402 at z 10 against 406 at z 11, 416 at z 9 and 458-477 away from focus. That parquet was not decoded (no parquet reader on the allowlist), so z 10 is measured here, not quoted. The nuclei are visible, and the label's outlines lie on them, in every plane looked at (z 8, 12, 16); a bright-field maximum projection is not an image, so z_project is not used"
  - "c: 0, z: 0 on the labels: each label store has one channel and one z plane (t x 1 x 1 x 1712 x 1744); naming them drops the two axes, so each raw and its label are yx 1712 x 1744"
  - "voxel size y, x 382.016 nm from the multiscales scale of level 0 (0.3820158766750814 micrometer), matching the record's 382; neither a projection nor one plane has a z size here"
  - "label_key: annotations.source automatic -> auto_pred; classes 'VE-cadherin cell segmentation' -> cell and 'nucleus' -> nucleus; encoding instance-ids -> instance"
