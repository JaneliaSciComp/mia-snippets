reasons:
  - "tiff-pages-glob-txt-points for every array instead of the draft's tiff-zip-member-3: that snippet takes one file per array (124 raws), and no catalog snippet read the centriole point lists. This one stacks the fields of a folder along z (member-name order), reads the nucleus masks the same way, and marks the point lists on the same planes, so raws and labels come from one snippet and one file order. The z axis is a stack of independent 2D fields, not a volume (record dimensionality 2D)"
  - "the files' pages are channels: tifffile gives the axes QYX ('shaped' series, description {shape: [4, 2048, 2048]}), a page axis the file does not name; record.yaml technical.arrays says the pages are channels, the DNA dye in channel 0 and the markers in channels 1-3 in folder-name order. Measured on the first field of each folder: page 0 shows nuclei (the nucleus masks cover its bright regions), pages 1-3 show foci under the points of their own text files"
  - "one raw per folder and channel (20 raws, params.channel 0..3), not one cyx stack per folder as the issue proposed: the dataset names each annotation by the channel it belongs to (<field>_max_C0.tif masks channel 0, <field>_max_C<k>.txt lists the foci of channel k), and a label array is read for every plane of the raw it pairs with. Bound per channel, a crop of channel k carries exactly the annotation made on channel k, and a plane nobody annotated has no label array at all. A crop is one plane either way"
  - "channel 2 raws and labels (raw 2, 6, 10, 14, 18) list 14 fields each as plain urls: only those fields have a <field>_max_C2.txt. A missing file is a field that was NOT annotated in that channel, not a field without foci (the issue assumed the latter): train.txt and test.txt of each folder name one channel per field, channel 2 has a text file exactly for the fields listed with channel 2 (and for RPE1wt_CEP63+CETN2+PCNT_1_000_003), while channels 1 and 3 have one for every field, with 8 to 80 points each. All 318 text files were read while testing. The snippet refuses a points array in which an image has no text file, so the 54 unannotated channel-2 planes are left unbound rather than given an empty label; the urls are in member-name order, which is the order the globs of the other arrays give"
  - "RPE1wt_CEP63+CETN2+PCNT_1 has 5 pages per file (the record says 4), the other four folders 4; it has 24 fields (no 002_004), the others 25. Its page 4 is not bound: nothing annotates it, the folder name gives three markers and a DNA dye, and on field 000_000 it is nearly flat (p1 703, p99 889, max 1468)"
