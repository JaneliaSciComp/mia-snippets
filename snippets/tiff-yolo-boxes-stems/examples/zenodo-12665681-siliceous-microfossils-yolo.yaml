reasons:
  - "tiff-yolo-boxes-stems instead of the draft's tiff-jpeg-voc-zip-glob: the annotations are YOLO box tables (class xc yc w h, fractions of the image size), which no catalog snippet reads, and the images of one glob have many shapes, which no catalog snippet can separate; this snippet paints a table on the grid of the TIFF with the same stem and chooses the files of one array with params.stems"
  - "one raw per image shape, not per zip and extension as in the draft: the TIFF header of every image in test_dataset_part1.zip was read while testing (100 images) and they have 25 shapes (y, x) between 2032 and 2048 a side (the 12 .tiff.tif are all 2048x2046, the 88 .tiff have all 25 shapes). Bound here, largest first, shape (images): 2048x2046 (22), 2048x2048 (17), 2048x2044 (13), 2044x2042 (5). All are single-page uint8 grey TIFFs (photometric minisblack; .tiff LZW, .tiff.tif uncompressed), one image per z plane (independent 2D fields, record dimensionality 2D)"
  - "raw urls are the two member globs obj_train_data/*.tiff and obj_train_data/*.tif (the latter matches the .tiff.tif files; a single *.tif* would also match the .tiff.txt tables), narrowed by params.stems to the files of one shape. stems are the member names without folder and last extension, so X.tiff has stem X and Y.tiff.tif has stem Y.tiff"
  - "NOT BOUND, and why: (1) the 43 test images of the 21 shapes that have fewer than five images each (left out to keep the number of arrays, and so of requests at open, small), shape (images): 2036x2036 (4), 2042x2042 (4), 2046x2044 (4), 2046x2048 (4), 2038x2038 (3), 2044x2044 (3), 2046x2046 (3), 2036x2038 (2), 2040x2038 (2), 2040x2040 (2), 2044x2048 (2), 2032x2032 (1), 2032x2036 (1), 2036x2040 (1), 2036x2042 (1), 2040x2036 (1), 2042x2040 (1), 2042x2046 (1), 2044x2040 (1), 2044x2046 (1), 2046x2036 (1); (2) the 691 images of training_dataset_part1..6.zip, whose headers were not all read: every array costs 2 to 4 requests at open and Zenodo allows 133 requests a minute, shared by everyone behind one address and answered with 429, which the harness does not retry; a header scan of all seven zips and a binding of some hundred more arrays did not fit this round. They bind the same way: one raw per zip and shape with that shape's stems. Whether a binding of that many arrays opens within the request limit needs a human decision (or a harness that waits on 429)"
  - "label urls obj_train_data/*.txt with the same stems list as the raw they pair with: X.txt is the table of X.tiff and Y.tiff.txt of Y.tiff.tif (record alignment_notes), so table and image have the same stem. The snippet sorts the files of an array by stem, so z index k of a label is the table of z index k of its raw; in this zip the 100 image stems and the 100 table stems are the same set, each once (compared while testing). train.txt, obj.names and obj.data lie outside obj_train_data/ and are not matched"
  - "classes: the 14 names of the zip's obj.names in file order (the record's classes, ids 0..13), so semantic ids are the record's class ids + 1 because 0 is background. The test tables use ids 0..10 and 12; Foraminifer (11) and Test (13) do not occur in them"
  - "NEEDS A HUMAN DECISION, boxes as two labels per raw: the record's encoding is boxes-table, which has no segmentation_type and no label-key kind. As for tiff-jpeg-voc-zip-glob's VOC boxes, each raw gets boxes instance (each box filled with its row number, segmentation_type instance, label_key manual_gt-microfossil-instance as the draft intended) and boxes semantic (each box filled with its class id + 1, segmentation_type semantic, label_key manual_gt-microfossil-semantic). Both are filled rectangles, not outlines: a consumer must not take them for pixel-accurate masks. Where boxes overlap the smaller one is on top. The bound tables hold 1579 boxes, 0 of them hidden completely by smaller boxes; 15 of the 57 bound tables have no row and are all-background planes (images annotated as empty)"
  - "label_key source manual_gt: the boxes were drawn by hand (the draft's choice; the paper's training and test annotations, a CVAT YOLO export)"
  - "label dtype uint16 where the record says float32: the record describes the table's numbers, the snippet returns the rasterised ids"
  - "voxel size unknown (record voxel_size_nm null; the TIFF headers carry no calibration)"
