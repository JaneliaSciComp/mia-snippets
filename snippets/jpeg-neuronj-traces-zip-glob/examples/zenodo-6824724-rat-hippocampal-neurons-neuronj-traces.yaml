    urls: &images
      - "https://zenodo.org/api/records/6824724/files/unprocessed.zip/content::unprocessed/*-div005/C/D/*_[0-9][0-9][0-9][0-9].jpg"
      - "https://zenodo.org/api/records/6824724/files/unprocessed.zip/content::unprocessed/*-div020/*_[0-9][0-9][0-9][0-9].jpg"
      - "https://zenodo.org/api/records/6824724/files/unprocessed.zip/content::unprocessed/*-div030/C/B/4/*_[0-9][0-9][0-9][0-9].jpg"
      - "https://zenodo.org/api/records/6824724/files/unprocessed.zip/content::unprocessed/*-div030/C/D/*_[0-9][0-9][0-9][0-9].jpg"
