name: ndpi-ndpa-regions
spec_version: 1
summary: One Hamamatsu NDPI whole-slide image (JPEG RGB) at a plain URL, its full-resolution level as yxc uint8 read strip by strip by byte range; or, with its .ndpa (NDP.view annotation XML) beside it in urls, the closed freehand regions, whose points are nanometres from the slide centre, placed with the NDPI's own offset and resolution tags and filled onto that level's grid as yx uint8 class ids by region title.
formats: [tiff, other]
containers: [http, s3]
params:
  classes: {type: list, required: false, doc: "label form only, and required for it: every region <title> the NDPA uses, in class id order (id = position, from 1; 0 is unannotated). A region whose title is not listed raises. Regions are painted in this order, so where two classes overlap the later one is kept. From the record's classes; reason required in binding"}
requires: [numpy, tifffile, imagecodecs]
tested_on: [idr0082-pennycuick-cis-lung-he-wsi]
supersedes: null
