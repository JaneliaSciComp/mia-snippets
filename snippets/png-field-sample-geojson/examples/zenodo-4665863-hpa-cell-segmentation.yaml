reasons:
  - "png-field-sample-geojson for every array instead of the draft's png-channels and image-tiles-glob: the mask is an RGB PNG whose samples differ (image-tiles-glob samples: grey raises, png-channels refuses colour type 2) and no catalog snippet reads GeoJSON; this snippet reads the grey channels, one sample of the mask and the polygons of one field"
  - "one raw per field, not a z stack: fields differ in shape and bit depth (measured through the snippet: 14060_105_G9_1 is 4x1728x1728 uint8, 2990_1586_E11_1 and 30901_1656_F1_1 are 4x2048x2048 uint16, 40520_1775_F1_1 is 4x3072x3072 uint16; the record's single 2048x2048 uint16 is one of three shapes)"
  - "four of the nine valid fields, chosen to cover the three shapes and both bit depths and to include the record's sampled field 2990_1586_E11_1: every array opened is at least one deflated zip member (two requests) and Zenodo answered 429 TOO MANY REQUESTS when all nine fields were read in one job. The other five valid fields and the 257 train fields have the same layout and bind the same way; the five valid ones were measured (snippet README), the train fields were not read"
  - "raw urls are the draft's member glob [emnp]*.png per field folder: it expands to er.png, microtubules.png, nuclei.png, protein.png in that sorted order, so c = 0 ER, 1 microtubules, 2 nuclei, 3 protein of interest (file names; record labels_stains), and does not match cell_border_mask.png or the macOS ._ sidecars"
  - "label manual_gt-cell-instance is annotation.json with the field's er.png as the second url: GeoJSON holds coordinates only, so the snippet takes the grid (height, width) from that PNG's header, the file the raw's open already fetched; none of its pixels is read for the label. Ids are the 1-based positions of the Polygon features (13, 14, 35 and 15 cells in the four fields), all with properties.label 'cell'"
  - "y_up: true, which the record does not say (it calls the coordinates image pixel coordinates): the GeoJSON y axis points up, row = height - y. Measured against sample 2 (the cell area) of the same field's cell_border_mask.png: with y up the filled polygons differ from it in 21 of 4,194,304 pixels on 2990_1586_E11_1, 11 on 30901_1656_F1_1 and 55 on 40520_1775_F1_1 (IoU 1.0000), against IoU 0.36, 0.21 and 0.16 with y down; shifts of half a pixel raise the difference on 2990_1586_E11_1 to 6,401 pixels or more"
  - "on 14060_105_G9_1 the polygons and sample 2 agree less (IoU 0.958 with y up, 0.137 with y down; the same on 3 other valid fields, 0.95 to 0.97), at every sub-pixel offset tried: there the stored mask was not drawn from the polygons as they are in the file. My reading is a different revision of the annotation; the dataset does not document it. Both labels are bound as the files give them"
  - "label manual_gt-cell_border-semantic is sample 1 (G) of cell_border_mask.png, the sample the match agent asked to be established by measurement: sample 0 (R) is zero in all nine valid fields; sample 2 (B) is the cell area (17% to 88% of the pixels); sample 1 is a thin set (971 to 80,107 pixels, values {0, 255}) of which every pixel lies within 6 pixels of two different polygon ids in the three fields checked, so it marks the borders where neighbouring cells touch, not every cell's outline. label_key kept from the draft"
  - "segmentation_type binary for the border: one class, stored as 0/255, written as nonzero. Sample 2 is not bound: it is the union of the cells, which the instance label already gives"
  - "smoke warns that the instance label's uint16 is not the record's label dtype: the record lists annotation.json with dtype unknown, and the snippet fills ids as uint16"
  - "no voxel size: neither PNG nor GeoJSON states one and the record has voxel_size_nm null"
  - "not bound: the 10 test fields (channels only, no labels) and the 512x512 zip (hpa_cell_segmentation_dataset_v2_512x512_4train_159test.zip), which was not read here"
