reasons:
  - "raw: 84 micrographs, one MRC file each (harness describe of the first: mode 2 float32, 4096x4096x1, axis order 1 2 3), bound as one array per file because mrc-http-3 takes exactly one URL per array; file list from harness list of the record download_url with ::*.mrc (84 matches, the record's n_items)"
  - "mrc-http-3 presents each file as zyx with z = 1; the record gives yx 4096x4096"
  - "no mode0 param: the files are mode 2, not mode 0"
  - "voxel size is not in the file (MRC cell is 0 0 0); the record gives 0.177 nm in x and y. The labels report none either (a points table states none)"
  - "raw: the border of every micrograph is replicated edge pixels, and that is what the files hold, not something the reader adds. In all 84 files rows 0..95 are copies of row 96, rows 4010..4095 copies of row 4009, columns 0..67 copies of column 68 and columns 3989..4095 copies of column 3988: the image proper is rows 96..4009 by columns 68..3988 (3914 x 3921), and 8.5% of each 4096x4096 file is this margin, the same in every file. Measured on the first and last 192 rows of each file fetched with plain HTTP range requests (curl, no harness, no snippet); for Falcon_2012_06_12-14_33_35_0 mrc-http-3 returns those rows bit for bit. A crop that reaches the margin shows the image stop and its last row or column repeat to the edge of the file (what review saw in crop 003 of batch 0 of round i27657350-e1794882943220, the data stopping two thirds of the way down, is what a 256-pixel crop starting near row 3838 shows; that crop's box was not available here to confirm). mrc-http-3 returns the file as it is; a snippet never crops (SPEC), so the margin stays in the raw"
  - "labels against that margin: 40862 of the 40863 picks are inside the image proper; one (x 1407, y 4011, row 271 of Falcon_2012_06_12-15_46_37_0.coord) is two rows into the bottom margin. Discs of picks near the border reach into the margin"
  - "labels with xy-points-mrc-grid: each micrograph has a same-stem .coord, a headerless whitespace-separated X Y text table (record encoding points-table, alignment same-grid). All 84 were read: 40863 rows (153 to 782 per file), every line two non-negative integers, x 93..3963 and y 120..4011, so every point is inside the 4096x4096 grid. One label per micrograph, pairs_with the raw of the same stem (raw and label lists are in the same sorted order)"
  - "two urls per label, [table, same-stem MRC]: the table does not state the image size, so the snippet takes the grid (z 1, y 4096, x 4096, as mrc-http-3 presents the raw) from the MRC's header; 1024 bytes of it are read, no pixels"
  - "X is the column and Y the row counted from the first row of the MRC data, as mrc-http-3 returns it (no flip). Checked on Falcon_2012_06_12-14_33_35_0: the micrograph's 32-pixel block means at the 632 points are 1.29 standard deviations below the image mean with row = y, col = x, and within 0.1 of zero (random positions: 0.007 +/- 0.033) with y flipped, x flipped, both flipped or x and y swapped; the average of the 632 windows around the points is a dark particle about 60 pixels across with a bright fringe, centred on the point within a few pixels in x and y. Checked on that one micrograph only"
  - "coordinates taken as 0-based pixel indices; the files do not decide 0- against 1-based: every value in all 84 files is a multiple of 3 (picked on a 3x-binned display, it seems), no value is 0 or 4096, and one pixel is far below that precision"
  - "segmentation_type instance: a point is one particle, and its id is its 1-based row number in its .coord file, so ids are unique within a micrograph, not across micrographs. SPEC has no type for points; instance keeps particles apart where binary would merge them (the snippet's values also encode as binary if a human prefers a {0,1} marker mask)"
  - "label_key manual_gt-particle-points by the label-key rule: provenance manual (the record's 'manually selected coordinates by Richard Henderson'), class particle, encoding points-table"
  - "radius 12, not the default 0: with the default each particle is a single pixel of a 4096x4096 image, which the nearest-neighbour label pyramid drops at the first downsampling and which a 256-pixel preview barely shows. A 12-pixel radius (a disc 25 pixels across, 4.4 nm at the record's 0.177 nm) stays visible to 8x. It is a centre marker, NOT the particle's outline: the record gives no particle size (the averaged windows show a dark core about 60 pixels across). Of the 40863 points, two pairs are closer than 25 pixels (15.0 apart in Falcon_2012_06_12-17_26_54_0, 15.3 in Falcon_2012_06_12-18_21_21_0; the next closest pair is over 25, and 130 pairs are under 60), so those two pairs of discs meet and each pixel there takes the nearer point; no other discs touch. A human should confirm the marker size, or radius 0 for bare points"
  - "one pick is listed twice: rows 291 and 292 of Falcon_2012_06_12-15_41_22_0.coord are the same point, so id 292 of that label is hidden under id 291 (the earlier row wins a tie)"
  - "the labels mark picked particles only: 0 is 'not picked', not 'no particle'; the record does not say the picking is exhaustive"
