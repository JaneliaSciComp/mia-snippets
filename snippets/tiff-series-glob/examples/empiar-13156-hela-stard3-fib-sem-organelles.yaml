reasons:
  - "tiff-series-glob with six glob urls, one per sub-folder in series order: the HeLaSTARD3_FA_YA raw is 600 single-page uint8 TIFFs image001.tif ... image600.tif, one z slice each (record alignment_notes 'z = slice number in the file name'), kept 100 to a folder in 1-100/ ... 501-600/ (harness list: all 600 listed by name, no gaps); a directory glob does not descend into sub-folders and tiff-series-http's counter cannot change folder, so each folder is one `<dir>/::image*.tif` url and the snippet concatenates them as zyx 600x1092x2516"
  - "count 600: the record's slice count for this volume (600 pages in each label stack, 600 files in the listing); the snippet refuses to open if the six indexes give another number, so the raw cannot silently pair with the 600-page label stacks at a wrong z"
  - "only the HeLaSTARD3_FA_YA volume is bound: it is the one the record sampled; HeLaSTARD3_WT (810 slices, image_NNN.tif in 4 folders) and HeLaWT (993 slices, ROI_CICGFA_NNN.tif in 5 folders, number 154 absent) read the same way, but HeLaWT's label page count (993 or 994) is not established, an open point of the match report"
  - "tiff-series-glob for the labels too, one url each and no params: each is one plain multi-page uint8 LZW TIFF at a plain URL (record technical.arrays), which the snippet reads as zyx with one page per z plane (record notes: the label page axis is z and the page count equals the raw slice count). tiff-zip-member reads the same files, but its open walks the 600 IFDs spread through each 22 MB file in about 23 separate 1 MiB requests with no retry, and ftp.ebi.ac.uk takes 12-35 s to answer each request and drops some (the match report's three smoke runs and the first crop job ended in ReadTimeout / RemoteProtocolError); this snippet reads such a file whole in three 8 MiB requests and retries a request that fails in transit"
  - "label keys: provenance unknown because annotations.source is mixed; class from the record's classes (endosome/lysosome, mitochondria); kind semantic and segmentation_type binary because the record gives encoding binary, values {0,1}, for Endosomes_ROI.tif and Mitochondria_ROI.tif. Only the curated-ROI masks are bound: the whole-volume masks (X.tif) would take the same label_key for the same raw, and ER_ROI.tif, Endosomes.tif and Mitochondria.tif have encoding unknown in the record"
  - "no voxel size bound: record imaging.voxel_size_nm is null (differs per volume) and the TIFFs carry no calibration (record notes: ImageJ default of 1 px = 1 micron, ignored)"
