name: tiff-series-glob
spec_version: 1
summary: A numbered series of single-page grey TIFF files, one file per z plane, spread over several HTTP folders; each url is a file or a `<dir>/::<glob>` over one folder's index, and the urls are concatenated in order as zyx.
formats: [tiff]
containers: [http]
params:
  count: {type: int, required: false, doc: "the number of files (z planes) the urls must stand for, from a complete listing; open fails when the directory indexes give another number, so a folder left out or a changed listing is noticed. Without it the count is whatever the globs match; reason required in binding"}
requires: [numpy, tifffile, imagecodecs]
tested_on: [empiar-13156-hela-stard3-fib-sem-organelles]
supersedes: null
