reasons:
  - "snippet tiff-zip-staged-instance-masks for every array instead of the draft's tiff-zip-member-2: the bitstream's HEAD has no Content-Length, so io.open, io.fetch and io.list of a <zip>::<member> url all raise NeedsFetch (the issue's report). This snippet stages the whole zip once with io.fetch(<zip url>) (661,181,494 bytes, counted against the job's cap; a cache hit afterwards) and reads the members from the local file"
  - "raw 0-21: the 22 synthetic images synthetic_images/images/<N>.tif, N = 0-11 and 13-22 (there is no 12 in the zip), each a 2056 x 2464 uint8 yx plane as the record says; one raw per image because each image has its own set of masks"
  - "labels of raw 0-21: urls is the glob synthetic_images/masks/<N>/*.tif, which the snippet expands against the staged zip (the harness's io.expand cannot list this zip); the record pairs images/<N>.tif with every .tif in masks/<N>/ on the same grid. instances: true because each file is the 0/1 mask of one pasted object (3 to 103 per image); they are merged into one uint16 instance-id plane, id = mask file number + 1"
  - "classes masks/<N>/<N>.npy with class_id 1 (particle) and 2 (bubble), one label per class: the .npy is a uint8 vector with one entry per mask file, values 1 and 2, and config_file.json class_colors says particle = 1, bubble = 2. The record had not opened the .npy; that entry k belongs to mask k.tif was checked on images 0 and 13, where the class-2 masks are the discs (they fill 0.76-0.79 of their bounding box, a disc fills 0.785) and the class-1 masks are irregular. One plane per class also keeps both objects where a particle and a bubble mask overlap"
  - "masks overlap in 12 of the 22 images (5 to 6365 pixels per image, never more than two masks deep, in every class combination); the snippet gives such a pixel to the higher-numbered mask. The files do not say which object is in front, so this is a convention, not a measurement"
  - "the instance planes are uint16 (the snippet's fixed dtype for merged ids), not the uint8 the record lists for the single mask files; smoke warns about it for each of the 44 instance labels"
  - "label_key auto_pred-particle-instance and auto_pred-bubble-instance, segmentation_type instance: the masks are generated by the copy-paste generator from watershed-derived object masks (automatic), one id per object"
  - "raw 22 and its label: the draft's pair image_database/objects/particle_99.tif with image_database/masks/particle_99.tif (same file name, 113 x 113 uint8 in both, record alignment_notes), read as plain single members (no params). label_key auto_pred-particle-semantic, segmentation_type binary as in the draft: marker-controlled watershed mask stored 0/255, class particle from the file name prefix"
  - "the other 655 image_database object/mask pairs are not bound: each is one small crop (113 x 113 to 427 x 427) that needs its own raw and label entry, and the synthetic images are pastes of these same objects"
  - "voxel size: none from the files (the TIFFs carry no pixel size); the record's 231.4 nm is stated only for the real test images"
