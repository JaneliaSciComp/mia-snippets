reasons: ['png-json-boxes-numbers instead of the draft''s image-tiles-glob and jpeg-xml-boxes-numbers: the only annotation
    file is one COCO-style JSON for all 405 PNGs (record technical.arrays, encoding boxes-table), which no catalog snippet
    parses; this snippet reads the PNGs and rasterises the JSON''s boxes on each image''s grid, and orders both by file
    number', 'one raw per image size and pHYs, each listing its files as explicit urls: an array has one shape and one voxel
    size, and Zenodo has no directory index to glob (record notes: direct files are /api/records/6547151/files/<name>/content).
    The first 4 KB (IHDR and pHYs) of all 405 PNGs were read while testing and their sizes equal the JSON''s images[].width/height
    in every file. Groups bound: raw 0: 6577x4933, pHYs 4029567 px/m = 248.17 nm, 99 files (labeled; boxes: 4814 mitotic
    figure, 5209 not mitotic figure); raw 1: 6447x4835, pHYs 3947874 px/m = 253.30 nm, 49 files (labeled; boxes: 2317 mitotic
    figure, 1356 not mitotic figure); raw 2: 7215x5412, pHYs 4418504 px/m = 226.32 nm, 45 files (labeled; boxes: 402 mitotic
    figure, 848 not mitotic figure); raw 3: 7215x5412, pHYs 4396693 px/m = 227.44 nm, 24 files (labeled; boxes: 211 mitotic
    figure, 583 not mitotic figure); raw 4: 7215x5412, pHYs 4407992 px/m = 226.86 nm, 13 files (labeled; boxes: 337 mitotic
    figure, 516 not mitotic figure); raw 5: 7215x5412, pHYs 4407087 px/m = 226.91 nm, 5 files (labeled; boxes: 49 mitotic
    figure, 52 not mitotic figure); raw 6: 7215x5412, pHYs 4408504 px/m = 226.83 nm, 5 files (labeled; boxes: 15 mitotic
    figure, 149 not mitotic figure); raw 7: 7215x5412, pHYs 4417992 px/m = 226.35 nm, 3 files (labeled; boxes: 26 mitotic
    figure, 67 not mitotic figure); raw 8: 6463x4837, pHYs 3947874 px/m = 253.30 nm, 2 files (labeled; boxes: 19 mitotic
    figure, 54 not mitotic figure); raw 9: 7215x5412, pHYs 4418583 px/m = 226.32 nm, 2 files (labeled; boxes: 18 mitotic
    figure, 17 not mitotic figure); raw 10: 7215x5412, pHYs 4396811 px/m = 227.44 nm, 2 files (labeled; boxes: 4 mitotic
    figure, 29 not mitotic figure); raw 11: 7215x5412, pHYs 4400512 px/m = 227.25 nm, 2 files (labeled; boxes: 11 mitotic
    figure, 35 not mitotic figure); raw 12: 7215x5412, pHYs 4418504 px/m = 226.32 nm, 14 files (no annotations; boxes: 0
    mitotic figure, 0 not mitotic figure); raw 13: 7215x5412, pHYs 4396693 px/m = 227.44 nm, 12 files (no annotations; boxes:
    0 mitotic figure, 0 not mitotic figure); raw 14: 7215x5412, pHYs 4407992 px/m = 226.86 nm, 8 files (no annotations;
    boxes: 0 mitotic figure, 0 not mitotic figure); raw 15: 7215x5412, pHYs 4407087 px/m = 226.91 nm, 6 files (no annotations;
    boxes: 0 mitotic figure, 0 not mitotic figure); raw 16: 7215x5412, pHYs 4408504 px/m = 226.83 nm, 4 files (no annotations;
    boxes: 0 mitotic figure, 0 not mitotic figure); raw 17: 7215x5412, pHYs 4419016 px/m = 226.29 nm, 4 files (no annotations;
    boxes: 0 mitotic figure, 0 not mitotic figure); raw 18: 7215x5412, pHYs 4413701 px/m = 226.57 nm, 2 files (no annotations;
    boxes: 0 mitotic figure, 0 not mitotic figure). The snippet checks every file it reads against its array''s first file
    (size, bit depth, samples, pHYs) and raises on a difference, so a wrong list cannot give a wrong plane', 'NEEDS A HUMAN
    DECISION, 104 images not bound: 301 of the 405 files are in the 19 groups above; the other 104 (103 of them annotated)
    each have a size (and pHYs) no other file has (the record''s ''five image sizes'' is from the files it probed; the JSON
    lists many more), so each would be its own one-file array, with two labels each. They are left out to keep the binding
    reviewable and its opens (one HEAD and one range request per array) under Zenodo''s per-minute request limit, which
    the harness does not wait out; any of them can be added as raw urls [<NNN>.png url] with labels numbers [NNN]', 'samples
    [0, 1, 2] on every raw: the files are RGBA (colour type 6, 8 bit, in all 405 headers); the record says channels 3, RGB
    H&E plus an alpha channel, so c is R, G, B and the alpha sample is left out. In 350.png, decoded whole while testing
    (7215x5412x4), the alpha sample is 255..255 and R, G, B span 0..255', 'count on every raw and label: the number of files
    in the group, so a changed url list or JSON fails at open instead of shifting z', 'voxel size is not bound; the snippet
    reports it from each array''s pHYs chunk (pixels per metre, unit 1), equal in x and y: see the groups above. The record
    has voxel_size_nm null because the files differ (paper: 0.23-0.25 um/px by scanner; pHYs 226.8-253.3 nm), which is why
    the groups are also split by pHYs', 'labels: the JSON url with numbers = the file numbers of the raw it pairs with (written
    as runs) and the same count. images[].file_name is NNN.png (record alignment_notes); raw planes are the urls in ascending
    file number and label planes the JSON''s images in ascending file number, so z index k of a label is the annotation
    plane of z index k of its raw. Each label plane''s grid is the JSON''s width/height for that image, which the PNG headers
    confirmed', 'bbox corners: annotations[].bbox is [x1, y1, x2, y2], not COCO xywh (record alignment_notes; x2 - x1 =
    y2 - y1 = 50 in all 20552 annotations, checked while testing). 2295 boxes have a corner at a half pixel, which the snippet
    moves outwards (51 px on that side), and 223 reach past an image edge, where they are cut', 'NEEDS A HUMAN DECISION,
    boxes as two labels per raw: the record''s encoding is boxes-table, which has no segmentation_type. As in the catalog''s
    other box bindings, boxes instance with classes [mitotic figure] (each mitotic-figure box filled with its number in
    its image, segmentation_type instance) tells the mitotic figures apart, and boxes semantic with both classes paints
    the JSON''s category ids (1 mitotic figure, 2 not mitotic figure, the hard negatives; record classes), segmentation_type
    semantic. Both are filled 50x50 px squares around a cell, not cell outlines: a consumer must not take them for pixel-accurate
    masks. Where two boxes overlap the smaller is on top, and of two of one size the later one in the JSON', 'label_key manual_gt-mitotic_figure-semantic from
    the draft (annotations by pathologists'' consensus -> manual_gt) and manual_gt-mitotic_figure-instance beside it; the
    semantic label also carries class 2, not mitotic figure, so a human may prefer another class word or one key per class
    (the match agent''s remark)', 'NEEDS A HUMAN DECISION, images without annotations ([''355-405'']): the record says images
    355-405 have no annotations (unlabeled, not checked and found empty), so their groups are raws without labels rather
    than all-background label planes, which the snippet would also give. Drop those raws if only annotated images are wanted']
