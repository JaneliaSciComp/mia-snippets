  - snippet: svs-coco-polygons
    urls: ["https://pathdb.cancerimagingarchive.net/index.php/system/files/wsi/ross/CATCH/Histiocytoma/Histiocytoma_02_1.svs"]
    params: {}
labels:
  - snippet: svs-coco-polygons
    urls: ["https://www.cancerimagingarchive.net/wp-content/uploads/CATCH-json.zip::CATCH.json"]
    params: {file_name: Histiocytoma_02_1.svs}
