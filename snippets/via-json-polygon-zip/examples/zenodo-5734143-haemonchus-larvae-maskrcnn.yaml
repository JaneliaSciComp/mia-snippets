reasons:
  - "raw: jpeg-zip-glob over the record's one 22.7 GB zip, as in the draft (RGB samples kept as c; record axes yxs, 2160x2560x3 uint8), but with one raw per file-name pattern instead of one per split, so that only annotated images are bound (next reason). Raws 0-6 are the 69 annotated train images, raws 7-11 the 26 annotated val images"
  - "only annotated images are bound: the VIA files list all 135 train and 46 val images, but 66 train entries ('train (45)' to '(105)' and '(107)' to '(111)') and 20 val entries ('test (19)'-'(21)', '(25)'-'(41)') have regions: []. They are not empty fields: 'train (100).jpg' was decoded and viewed while testing and is full of eggs and larvae with no polygon. A label plane of zeros there would call animals background, so those 86 images are left out. fnmatch has no alternation, hence 7 + 5 patterns: train (1)-(9), (10)-(39), (40)-(44), (106), (112)-(119), (120)-(123), train_t01_01..12; test (1)-(9), (10)-(18), (22)-(24), (42), test_motility_t01_013..016. Counted from the JSONs: 57 + 12 = 69 and 22 + 4 = 26 images, every one with at least one polygon"
  - "the 86 unannotated images can be bound as further label-less jpeg-zip-glob raws if a human wants them as raw data; they are not bound here because this binding is for the annotations"
  - "labels with via-json-polygon-zip: url is the split's annotation_file.json as a zip member (the leading * stands for the top folder, whose name ends in a space); `images` repeats the file-name part of the paired raw's glob, and both snippets sort the matching members of that folder by name, so plane k of a label is the annotation of plane k of its raw. Checked while testing: for all 12 pairs the label's image names equal the names the raw's glob matches, in order. A raw of one image is cyx and its label yx"
  - "entries and files agree: each JSON's entry file names are exactly the jpg members of its folder (135 and 46), and every entry's VIA `size` equals its member's byte size, so the JSONs were made from these files"
  - "val uses val/annotation_file.json (3,586 polygons), which the record names as the val annotation; val/test_annotation.json (3,594) and val/test_old.json (VIA project file, 3,217) are other versions of the same 46 images and are not bound"
  - "attribute Hco_stage, classes [egg, L2, L3]: the only region attribute, and its only three values in both files (train egg 3,385 / L2 1,592 / L3 1,820; val egg 2,487 / L2 559 / L3 540), in the record's class order, so semantic ids are 1 egg, 2 L2 (the paper calls it L1), 3 L3; 0 is background"
  - "two labels per raw, so that nothing in the file is lost: fill instance (each polygon its own id, restarting per image; segmentation_type instance) tells touching animals apart, fill semantic (class id; segmentation_type semantic) carries the stage. Where polygons overlap (larvae cross, eggs clump) the smaller one is on top. All 6,797 train polygons keep at least one pixel; 3 of the 3,586 val polygons (eggs: 'test (18).jpg' regions 72 and 86, 'test (22).jpg' region 309) are wholly covered by smaller polygons and leave no pixel"
  - "coordinate frame: vertices are VIA image pixel coordinates (x right, y down, integers; x spans -2..2560 and y -2..2160, i.e. the image edges, cut at the grid). Checked on 'train (1).jpg' (25 polygons): mean grey inside the filled polygons is 123 against 143 outside, and 145 to 150 with the mask moved 40 px in any direction or 148 to 153 mirrored; an overlay shows the outlines on the animals"
  - "NEEDS A HUMAN DECISION, label_key class slug: the polygons mark three life stages (egg, L2, L3) of one nematode rather than one listed class. Chosen here: manual_gt-nematode-instance and manual_gt-nematode-semantic (my choice of slug; the stage is in the semantic ids). manual_gt because the polygons were drawn by hand in VIA as Mask R-CNN training data"
  - "annotated images may still be incompletely annotated (debris and some animals carry no polygon), so 0 means 'no polygon', not certainly background"
  - "voxel size: none; neither the JPEGs nor the VIA files carry a pixel size and the record found none"
