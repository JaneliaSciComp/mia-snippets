reasons:
  - "jpeg-tile-class-csv-i290 instead of the draft's jpeg-zip-glob: the draft bound the 10 scans of am/test as one z stack and no labels. jpeg-zip-glob needs every image of an array to have the first one's shape and raises at read otherwise (the match agent's report), and no catalog snippet reads a tile class table. This snippet reads one scan per array, so nothing is padded or left out, and paints the scan's table on its pixel grid"
  - "one raw per scan, cyx uint8 (c = R, G, B; record: yxs uint8 RGB, channels 3), each a single 2D image (record dimensionality 2D): the 210 scans have 140 different shapes, 5862x12754 to 33519x64554 (height x width, from the frame header of every JPEG), 35 of them over 1,000 megapixels. A z stack on one canvas (jpeg-zip-canvas-glob) would make every plane of the ErM zips 37892x64554 and most of it fill, so the scans are bound one by one: 208 raws, urls `<zip>::<member>` from the zips' directories (all eight read: 210 .jpg and 210 .csv members, nothing else)"
  - "all eight zips are bound, not only am/test as in the draft: raw 0-9 am/test, 10-54 am/train, 55-84 erm_test.zip test/, 85-207 erm_train_1..6.zip train_1..6/ (43, 14, 21, 17, 16, 12 scans), in member-name order within each folder. The record's data is the 210 scans; the two sets differ only in the label's params"
  - "not bound: am/train/high_res_black_image_AM.jpg and high_res_white_image_AM.jpg (16384x16384). By name and table they are synthetic all-black and all-white images (every one of their 4,225 tiles is Background), training aids rather than micrographs; a constant image yields no crop. 208 of the 210 scans remain"
  - "pairing: each label's urls are its raw's JPEG and the CSV beside it named <jpg name without .jpg>_<timestamp>_cnn_1_annotations.csv (record alignment_notes; timestamp = YYYY-MM-DDTHH_MM_SS.ffffff). Matched over the zips' directories with that exact pattern: every CSV has exactly one JPEG and every JPEG exactly one CSV. The snippet takes the pair from the urls and checks only that the table's name starts with the image's stem and an underscore"
  - "tile 252 for am.zip. NOT STATED in the record, the Zenodo page, the CSVs or the JPEGs (the record says so; github.com is not a host this job may reach, so the MycorrhizaFinder code was not read). MEASURED from the data, two ways. (1) Grid arithmetic over all 57 AM tables: with tiles counted from the top left corner, every annotated tile lies inside its image only if the tile is at most 252.06 pixels (high_res_*: rows 0..64 in 16384 pixels), and the 19 tables that annotate a complete rectangle from tile (0, 0) are exactly the grid of whole tiles, floor(height / tile) x floor(width / tile), for 252 only (251: 11 of 19, 253: tiles fall outside; 5C_3U_A has 55 columns in 14110 pixels, so the tile is more than 251.96). (2) Image content, am/test/49B-2U-7 (9728x7168, 924 Background and 140 root tiles): how well the share of non-white pixels in a tile separates Background from the other classes (ROC AUC) peaks at 252: 0.942 at 256, 0.965 at 254, 0.987 at 252, 0.979 at 250, 0.862 at 240. A human who can read the MycorrhizaFinder source should confirm 252"
  - "tile 126 for the seven ErM zips, measured the same way and equally unstated: over the 153 ErM tables every annotated tile lies inside its image only if the tile is at most 126.03 pixels, and both tables with a complete rectangle are the floor grid for 126 only; on erm_train_4 train_4/T1_16_3_01-04_Default_Extended_T1_16_3_01 (12548x26854, 172 Background and 449 other tiles) the AUC is 0.951 at 126, 0.900 at 125 and 127, 0.775 at 124, 0.752 at 128. 126 is half the AM tile. The same scan is cut differently by the two models: erm_test's AM_49B-2U-7 has rows up to 71 where am/test's 49B-2U-7 has 38 rows"
  - "tile origin and orientation: tile (row, col) is rows [row * tile, (row + 1) * tile), columns [col * tile, (col + 1) * tile) from the top left of the JPEG as libjpeg decodes it; row counts down, col counts right. On the two scans above a grid centred in the image, anchored at the bottom right, shifted by half a tile, or flipped in y or x separates the classes worse (AM: 0.987 as bound, 0.934 centred, 0.856 bottom right, 0.40 and 0.23 flipped; ErM: 0.951, 0.389, 0.315, 0.27). The 44 JPEGs of am.zip with an EXIF block all have orientation 1 and the others are JFIF, so there is nothing to rotate. The strip beyond the last whole tile (up to tile - 1 pixels at the right and bottom) has no tile and is 0"
  - "classes, AM: the six class columns of the table header in header order, which is the record's class list: 1 AMColonised, 2 Uncolonised, 3 Background, 4 Unreadable, 5 DSE, 6 Hybrid. ErM: the ten class columns in header order (record alignment_notes): 1 BlueCoils, 2 BrownCoils, 3 TypeTwo, 4 Uncolonised, 5 Background, 6 MainRoot, 7 Unreadable, 8 DSE, 9 HybridErm, 10 HybridDse. 0 is 'no row for this tile': most tables annotate only part of the scan (21 of 210 a complete rectangle), so Background is a class with its own id and 0 is not background. The ids are per set: Uncolonised is 2 in AM and 4 in ErM, hence two label keys"
  - "NEEDS A HUMAN DECISION, multi-class and Question rows (the match agent asks which id they get): there are no multi-class rows. All 209,414 rows of the 208 bound tables were read; each has exactly one class set, except one. The snippet raises on a row with several classes rather than choosing. `ignore: [Question, QuestionComment]` on the ErM labels: Question is a reviewer's flag and QuestionComment free text, not classes (the bound AM tables do not have these columns). Question is 1 in a single row, erm_test.zip test/TW_02_Cal_01-04_Default_Extended_TW_02_Cal_01_...csv line 58 (row 46, col 118, comment 'Un or Br/HE? mislabel?'), which is also the one row with no class set; its tile stays 0, like an unannotated tile. To give flagged tiles an id of their own instead, add Question to `classes`"
  - "label_key manual_gt-am_colonisation_class-semantic and manual_gt-erm_colonisation_class-semantic, segmentation_type semantic: class ids per tile (record encoding one-hot, one class per tile). manual_gt is an ASSUMPTION for a human to check: the record block in the issue has no annotations.source; the Zenodo page calls the files 'training and test data' for the MycorrhizaFinder models, and the tables carry a reviewer's question column"
  - "41 scans are in the record twice: erm_test.zip (8) and erm_train_1.zip (33) hold scans named AM_<name> with the name and the height and width of a scan in am.zip, as different JPEG files (about twice the bytes), annotated with the ErM classes on the 126-pixel grid. Both copies are bound, each with the table beside it, since they carry different labels; a consumer that must not see a field twice has to drop one set"
  - "access: a raw is `plane` (any region costs fetching and decoding the whole scan: 3 bytes a pixel in memory, 0.2 to 6.5 GB, one scan at a time); a label is `chunk` (a region is made from the table, nothing is decoded), so the harness tests the drawn box for annotation instead of building a mask of the whole scan"
  - "dtype: labels are uint8 class ids; the record gives 'unknown' for the label array (a CSV), hence smoke's dtype warnings"
  - "voxel size: the snippet reports None (a JPEG carries no pixel size); the record's 270 nm x/y is from the record"
  - "snippets_commit is the commit before this snippet's own (a binding can't name the commit that adds it); a binding written by the worker names a commit that contains the snippet"
