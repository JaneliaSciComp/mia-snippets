reasons:
  - "jpeg-tile-class-csv-i290 instead of the draft's jpeg-zip-glob: the draft bound the 10 scans of am/test as one z stack and no labels. jpeg-zip-glob needs every image of an array to have the first one's shape and raises at read otherwise (the match agent's report), and no catalog snippet reads a tile class table. This snippet reads one scan per array, so nothing is padded or left out, and paints the scan's table on its pixel grid"
  - "one raw per scan, cyx uint8 (c = R, G, B; record: yxs uint8 RGB, channels 3), each a single 2D image (record dimensionality 2D): the 57 scans of am.zip have 30 different shapes, 9728x7168 to 28416x27136 (height x width, from the frame header of every JPEG). A z stack on one canvas (jpeg-zip-canvas-glob) would make every plane 29312x29952 and most of it fill, so the scans are bound one by one, urls `<zip>::<member>` from the zip's directory (57 .jpg and 57 .csv members, nothing else)"
  - "am.zip is bound whole, not only am/test as in the draft: raw 0-9 am/test, 10-54 am/train, in member-name order. Not bound: am/train/high_res_black_image_AM.jpg and high_res_white_image_AM.jpg (16384x16384). By name and table they are synthetic all-black and all-white images (every one of their 4,225 tiles is Background), training aids rather than micrographs; a constant image yields no crop"
  - "NOT BOUND, NEEDS A HUMAN: the seven ErM zips (erm_test.zip, erm_train_1..6.zip: 153 scans with 153 tables of ten classes, 5862x12754 to 33519x64554), because the tile size of their tables could not be established for every scan. Over the 153 tables every annotated tile lies inside its image only if the tile is at most 126.03 pixels, half the AM tile, and on erm_train_4 train_4/T1_16_3_01-04_Default_Extended_T1_16_3_01 (12548x26854) tiles of 126 pixels separate Background from the other classes sharply (ROC AUC of the share of non-white pixels: 0.951 at 126, 0.900 at 125 and 127, 0.752 at 128). But on erm_test test/TW_02_Cal_01-04_Default_Extended_TW_02_Cal_01 (18524x58490) 126 does not fit: the AUC is 0.23 (Background tiles darker than root tiles), and no size from 40 to 135 pixels gives more than 0.64 (at 105.5). The grid of that scan is scaled or offset in a way the files do not state, perhaps by a pixel size the software knows. A first test that bound the ErM scans at 126 pixels put a BlueCoils tile on empty background. The snippet reads these files (all 153 pairs opened, and their tables agree with a separate reading of the CSVs); what is missing is `tile` per scan, from the MycorrhizaFinder source (github.com is not a host this job may reach) or its authors. ErM classes in header order would be BlueCoils, BrownCoils, TypeTwo, Uncolonised, Background, MainRoot, Unreadable, DSE, HybridErm, HybridDse, with `ignore: [Question, QuestionComment]`; one row (erm_test TW_02_Cal_01 table line 58, Question 1, 'Un or Br/HE? mislabel?') has no class set. 41 of the ErM scans (AM_<name>) are re-encoded copies of am.zip scans with ErM labels"
  - "pairing: each label's urls are its raw's JPEG and the CSV beside it named <jpg name without .jpg>_<timestamp>_cnn_1_annotations.csv (record alignment_notes; timestamp = YYYY-MM-DDTHH_MM_SS.ffffff). Matched over the zip's directory with that exact pattern: every CSV has exactly one JPEG and every JPEG exactly one CSV. The snippet takes the pair from the urls and checks only that the table's name starts with the image's stem and an underscore"
  - "tile 252. NOT STATED in the record, the Zenodo page, the CSVs or the JPEGs (the record says so; the MycorrhizaFinder code could not be read). MEASURED from the data, two ways. (1) Grid arithmetic over all 57 AM tables: with tiles counted from the top left corner, every annotated tile lies inside its image only if the tile is at most 252.06 pixels (high_res_*: rows 0..64 in 16384 pixels), and the 19 tables that annotate a complete rectangle from tile (0, 0), on scans of 15 different shapes, are exactly the grid of whole tiles, floor(height / tile) x floor(width / tile), for 252 only (251: 11 of 19, 253: tiles fall outside; 5C_3U_A has 55 columns in 14110 pixels, so the tile is more than 251.96). 35 of the 57 tables reach the last whole row at 252 and 42 the last whole column. (2) Image content, am/test/49B-2U-7 (9728x7168, 924 Background and 140 root tiles): how well the share of non-white pixels in a tile separates Background from the other classes (ROC AUC) peaks at 252: 0.942 at 256, 0.965 at 254, 0.987 at 252, 0.979 at 250, 0.862 at 240. Pixels were checked on that one AM scan only; given what the ErM scans showed (above), a human who can read the MycorrhizaFinder source should confirm that 252 holds for every AM scan"
  - "tile origin and orientation: tile (row, col) is rows [row * tile, (row + 1) * tile), columns [col * tile, (col + 1) * tile) from the top left of the JPEG as libjpeg decodes it; row counts down, col counts right. On 49B-2U-7 a grid centred in the image, anchored at the bottom right, shifted by a quarter tile, or flipped in y or x separates the classes worse (0.987 as bound, 0.934 centred, 0.856 bottom right, 0.941 shifted, 0.40 and 0.23 flipped). The 44 JPEGs of am.zip with an EXIF block all have orientation 1 and the other 13 are JFIF, so there is nothing to rotate. The strip beyond the last whole tile (up to 251 pixels at the right and bottom) has no tile and is 0"
  - "classes: the six class columns of the table header in header order, which is the record's class list: 1 AMColonised, 2 Uncolonised, 3 Background, 4 Unreadable, 5 DSE, 6 Hybrid. 0 is 'no row for this tile': most tables annotate only part of the scan (106,548 of the 313,495 whole tiles of the 55 scans have a row), so Background is a class with its own id and 0 is not background"
  - "multi-class and Question rows (the match agent asks which id they get): the bound tables have neither. All 106,548 rows of the 55 tables were read and each has exactly one class set; none of the 55 has a Question column (only the two synthetic images' tables do, with Question 0 throughout), so no `ignore` is set. The snippet raises on a row with several classes rather than choosing"
  - "label_key manual_gt-am_colonisation_class-semantic, segmentation_type semantic: class ids per tile (record encoding one-hot, one class per tile). manual_gt is an ASSUMPTION for a human to check: the record block in the issue has no annotations.source; the Zenodo page calls the files 'training and test data' for the MycorrhizaFinder models"
  - "access: a raw is `plane` (any region costs fetching and decoding the whole scan: 3 bytes a pixel in memory, 0.2 to 2.3 GB, one scan at a time). A label costs nothing after open (a region is made from the table) and also reports `plane`, so that the harness searches the whole label for annotated tiles and places every other crop on one instead of testing only the box it drew"
  - "dtype: labels are uint8 class ids; the record gives 'unknown' for the label array (a CSV), hence smoke's dtype warnings"
  - "voxel size: the snippet reports None (a JPEG carries no pixel size); the record's 270 nm x/y is from the record"
  - "snippets_commit is the commit before this snippet's own (a binding can't name the commit that adds it); a binding written by the worker names a commit that contains the snippet"
