name: nd2-tiff-zip-glob
spec_version: 1
summary: Single-frame Nikon ND2 images (NIS-Elements Ver3 chunk files, one uncompressed grey 8- or 16-bit frame each) from zip members or plain URLs chosen by glob (or listed one by one), stacked along z; one file is yx. Also the single-page YX TIFF masks that label them, stacked the same way, so raw and label of one binding are read by this snippet. The ND2 container is parsed by the snippet; a deflated member is fetched whole; a request the host answers with 429 Too Many Requests (Zenodo's per-address limit) is made again after the Retry-After wait, which the harness does not do.
formats: [nd2, tiff]
containers: [zip, http]
params: {}
requires: [numpy, tifffile]   # no nd2 package (not on the allowlist): chunk map, attributes and calibration are parsed in snippet.py
tested_on: [zenodo-23377605-yeast-brightfield-cellpose-masks]
supersedes: null
