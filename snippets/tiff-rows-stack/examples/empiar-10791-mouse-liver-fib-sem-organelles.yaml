labels:
- snippet: tiff-rows-stack
  urls:
  - https://ftp.ebi.ac.uk/empiar/world_availability/10791/data/Parlakgul%20et%20al%20-%20Regulation%20of%20liver%20subcellular%20architecture%20controls%20metabolic%20homeostasis/FIB-SEM%20Raw%20and%20Segmentation%20Data/6461%20-%20Lean%20Liver/6461%20Lean%20Liver%20-%20Segmentation/6461%20Lean%20Mitochondria.zip::6461 Mito filled/0[0-9][0-9][0-9].tiff
  params: {}
  pairs_with: 0
  label_key: unknown-mitochondria-semantic
  segmentation_type: binary
reasons:
- 'tiff-rows-stack instead of tiff-zip-member: each raw slice is a 96 MB uncompressed single-page uint8 TIFF (record technical.arrays: yx 8000x12000, compression none) and tiff-zip-member decodes a whole page, so one 256 px patch was one 94,371,840-byte request that ftp.ebi.ac.uk never completed (issue: 3 runs, connection closed mid-body). tiff-rows-stack reads only the rows of the patch as one byte range located from the strip offsets (about 3 MB for 256 rows of 12000 px). No params: the files'' own yx axes match the record'
- 'raw urls: the first 1000 slices of the lean volume 6461, Gunes_WT1_8x8x8nm_3MHz.0000.tif .. .0999.tif, one url per z plane in name order (SPEC 2: one url per file, sorted), stacked as zyx 1000x8000x12000. The record spells out only slice 0000 and gives the rest as a pattern (layout.tree: 5638 .tif, Gunes_WT1_8x8x8nm_3MHz.NNNN.tif); the names were not guessed: they are entries of the https directory listing of ''6461 Lean Liver - Raw/'' (2026-11-10), which numbers 0000..5637 without gaps. Plain https urls cannot be globbed by io, so they are listed'
- 'only 1000 of the 5638 slices: listing all 5638 plain urls made this binding 1.7 MB, and the mia-data worker could not read it from the PR (''the binding is missing or unreadable''); 1000 urls keep it near 0.3 MB. Slices 1000..5637 are left to a later binding'
- 'label urls: one member glob, ''6461 Mito filled/0[0-9][0-9][0-9].tiff'' in 6461 Lean Mitochondria.zip (the record''s path_pattern for labels, narrowed to members 0000..0999 so the label has the raw''s z extent), expanded by the snippet from the zip''s central directory to its 1000 members sorted by name and stacked as z. The members are deflated (about 1.2 MB each), so each plane is staged whole (access plane)'
- 'pairs_with 0: record alignment same-grid; slice NNNN.tiff in the class zip corresponds to raw slice NNNN (technical.arrays alignment_notes, README: the same number of images per class as raw slices); both arrays sort by the 4-digit slice number, so z index k of the label is the mask of z index k of the raw; smoke opened both as 1000x8000x12000'
- 'only the lean volume 6461 (slices 0000..0999) with its mitochondria class is bound: the other six class zips of this volume and the three other volumes (6464, 9430, 1857) are described in the record only as patterns (''6461 Lean <class>.zip -> <n> <class>/NNNN.tiff''); their member-folder names are not in the record and were not listed, so they are left to a later binding'
- 'label_key unknown-mitochondria-semantic: annotations.source is mixed -> unknown; class mitochondria from the zip name ''6461 Lean Mitochondria.zip'' and member folder ''6461 Mito filled''; encoding binary -> semantic'
- 'segmentation_type binary: record encoding binary, values {0, 255} observed in the sampled slice'
