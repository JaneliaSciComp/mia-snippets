reasons:
  - "raw: the Case 2 stitched mosaic is a plain single-page grey TIFF (harness describe: YX 11381x15406 uint16 uncompressed), one url and no params; axes yx as the file and the record say"
  - "raw snippet tiff-series-glob, not tiff-zip-member-2 (which reads the same pixels): the choice is for Zenodo's request limit. zenodo.org allows 133 requests a minute to everything that comes from one address (x-ratelimit-limit: 133) and answers the next one 429, which the harness does not retry. tiff-zip-member-2 reads the page whole, 44 ranges of 8 MiB, and the crop job at 0fe4727 was refused with 429 on that TIFF after 72 MB, the limit being shared with other jobs. tiff-series-glob reads one file with one page as yx, reads the rows of a crop by range because the page is stored raw in one run (access chunk), and asks again after a 429 (three times within 7 s; a refusal that lasts longer still ends the job, as it did on the fifth crop at 743343b): a crop job of 8 makes 18 requests and fetches 68 MB, where it made 49 and the whole 351 MB TIFF"
  - "labels: Case2Vf.mat is a MATLAB 5.0 MAT-file (little-endian, every variable a zlib-compressed miMATRIX), read with mat5-variable. Variables found in it: BW, BW1, BW2, maskedImage1, maskedImage2, every one 11381x15406, the shape of the Case 2 stitched TIFF, so the label pairs with that mosaic"
  - "variable BW1,BW2: the BWn are logical masks (class uint8, logical flag, values 0 and 1), one per fibre bundle region: Case2Vf.m computes each bundle's fibre volume fraction as sum(BWn.*BW)/sum(BWn). The label is the bundle class, so the bundles of the image are one mask; with no combine param several names are their union"
  - "not combine ids: the record's label encoding is binary, and the bundle regions of one image can overlap (in Case1Vf.mat BW1 and BW6 do, and the snippet refuses ids there)"
  - "BW is not bound: Case2Vf.m computes it as the Otsu threshold of the image (BW = I>th), a fibre/matrix segmentation by threshold, not a manual annotation. maskedImageN are the uint8 image inside bundle N (zero outside), not labels"
  - "label_key manual_gt-fibre_bundle-semantic: annotations.source manual, masks mark manually drawn unidirectional fibre bundles, encoding binary; segmentation_type binary"
  - "Case 1 (Case1-Panorama - correlation matching.tif, 7559x41693 uint16 LZW, 809.6 MB, with BW1..BW8 of Case1Vf.mat) is not bound, because of Zenodo's request limit and not because of the data: an LZW page cannot be read by row range, so any TIFF snippet reads it whole, about 100 requests of 8 MiB on top of this binding's, which a fast link makes within the minute that allows 133 from the whole address (the crop job at 1ff8315, with both pairs, was refused on the Case 1 TIFF). mat5-variable reads Case1Vf.mat as it reads Case2Vf.mat (the snippet's README has the two entries to add and what was checked on them)"
  - "BMP tiles in Case2-PCB2.zip / Case1-Panorama.zip are not bound: no snippet reads BMP and they carry no masks"
