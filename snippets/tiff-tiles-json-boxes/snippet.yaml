name: tiff-tiles-json-boxes
spec_version: 1
summary: One single-page 2D TIFF (grey yx or RGB cyx; tiled or stripped, any codec tifffile decodes) from a zip member or a plain URL, read tile by tile by byte range; or, with the url of a COCO-like JSON annotation file beside the TIFF's, that file's boxes (bbox [x, y, width, height], category id) filled onto the TIFF's grid as yx uint16 instance or class ids.
formats: [tiff, json, other]
containers: [zip, http]
params:
  boxes: {type: str, required: false, doc: "label form only (a JSON url and a TIFF url), and required for it: how the annotation boxes are painted on the yx grid. 'instance' fills each box with its 1-based number in the file's annotations list; 'semantic' fills it with the 1-based index of its category's name in `classes`. 0 is background; where boxes overlap the smaller one is on top. Reason required in binding"}
  classes: {type: list, required: false, doc: "label form only, and required for it: every category name the file declares, in class id order (semantic id = position, from 1). A declared category whose name is not listed raises, in both modes. From the record's classes; reason required in binding"}
requires: [numpy, tifffile, imagecodecs]
tested_on: [zenodo-12804564-mouse-ovary-follicle-boxes]
supersedes: null
