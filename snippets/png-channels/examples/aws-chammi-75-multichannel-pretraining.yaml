reasons:
  - "png-channels instead of the draft's tiff-zip-member: every raw is a single-channel 8-bit grey PNG (record technical.arrays: format png, axes yx, uint8, deflate), which tifffile refuses ('not a TIFF file: header=b'\\x89PNG''); png-channels decodes PNG and has no params"
  - "raw 0 is the record's sampled idr0001 field with both of its channel files as cyx 2x1040x1376 instead of the draft's channel-0 alone: the dataset stores one PNG per channel of a field (record path_pattern <field>_channel-<c>.png), and a listing of the field's key prefix on chammi-data.s3.amazonaws.com (?list-type=2&prefix=...001001001_) returns exactly channel-0 and channel-1"
  - "raw 1 is the record's probed hpa0018 field (00070df0-..., <uuid>-ch<c>.png) with its four channel files ch0..ch3 as cyx 4x512x512, so the binding covers both file layouts and both shapes the record saw (shape_varies: true); the same prefix listing returns exactly ch0..ch3"
  - "all urls on chammi-data.s3.amazonaws.com, not the s3.us-west-2 host of the record's hpa0018 url: the record notes say the regional host is not on the allowlist and that the global host serves the same keys"
  - "explicit urls, no glob: the bucket has no HTTP directory index (harness list on the prefix returns 404), so the channels of a field are listed one url each, in channel-number order"
  - "two fields only: the other ~2.8M PNGs are not named in the record (listing_complete: false) and each field is its own array, since shapes and channel counts differ by study"
  - "no voxel size and no channel names: neither is in a PNG, and the record sets neither (they differ by source study)"
  - "no labels bound: record annotations.present is false (self-supervised pre-training set)"
