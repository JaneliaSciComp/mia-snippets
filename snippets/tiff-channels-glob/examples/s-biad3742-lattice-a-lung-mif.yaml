reasons:
- 'Partial binding: 329 of the 5,388 files (269 of 2,731 hallmarks, 60 of 2,657 immuno-oncology), every file whose header
  was read while the snippet was written. The files of a panel cannot be bound by one glob because they are not one shape
  (next reason), and grouping the rest needs each remaining file''s header (about 1 MiB per file through io, about 5 GB for
  the set), which was not read.'
- 'Six raw arrays, one per panel and yx shape: the record assumed every core is 2408x2408 (4 files probed), but the cores
  were cut out at several field sizes. Hallmarks P_0001_C1 to P_0100_C2 (all 269 files in name order): 213 files (10, 2408,
  2408), 41 files (10, 2892, 2896), 15 files (10, 3612, 3616). Immuno-oncology, every 45th file in name order (60 files):
  52 files (8, 2408, 2408), 5 files (8, 2892, 2896), 3 files (8, 3012, 3016). The sizes are scattered through the patients
  (e.g. P_0001_C1 2408, P_0035_C2 2892, P_0116_C1 3612), so no glob tells them apart and each array lists its files as plain
  urls. tiff-channels-glob checks every file against its array''s first when it is read, so a file listed under the wrong
  shape raises instead of being read.'
- 'tiff-channels-glob instead of the draft''s tiff-zip-member-2: it stacks many files as zcyx (z is the file, a stack of independent
  2D cores, not depth; record dimensionality 2D) and reads only the 512x512 LZW tiles a crop touches, about 1 MiB of header
  plus 1 to 4 tiles per crop instead of a whole 12 MiB page.'
- 'Axes cyx per file from tifffile series[0] (QPTIFF ''Baseline'', CYX, float32), which matches the record''s arrays; the
  301x301 RGB thumbnail and the 2x-reduced pages are other series or levels and are not read. No params: the snippet has none.'
- 'Channel order is the files'' page order, the same in all 329 bound files (read from each page''s XML <Name>, compared ignoring
  case and punctuation; the hallmarks files spell the names two ways, e.g. ''pdl1 (Opal 480)'' in 121 files and ''PDL-1 (Opal
  480)'' in 148). Hallmarks c 0-9: PD-L1 (Opal 480), N-cadherin (520), Ki67 (780), pan-cytokeratin (620), CA9 (690), vWF (570),
  DAPI, GLB1 (540), cleaved caspase 3 (650), autofluorescence. Immuno-oncology c 0-7: DAPI, Ki67 (650), CD8 (520), CD4 (570),
  SMA (540), pan-cytokeratin (620), CD68 (690), autofluorescence.'
- 'Voxel size is reported by the snippet from the QPTIFF resolution tags (pixels per cm): 497.17 nm in the hallmarks files
  and 497.05 nm in the immuno-oncology files, the record''s 497 nm; the same in every bound file of a panel.'
- 'No labels: the record has no annotations (self-supervised set; only a per-patient survival CSV).'
