name: tiff-csv-manifest-canvas-i291
spec_version: 1
summary: Single-page TIFF files (YX grey, or YXS colour read as c) named by the rows of a CSV manifest instead of a directory listing, one file per z plane - the one url is the manifest, `column` holds each file's name, `files` is the path beside the manifest with {name} in it, `where` filters rows by cell values. Height and width may differ per file - every plane is the canvas the binding gives, the file's pixels unchanged at its top left and 0 beyond them; a file larger than the canvas raises. With `shape_column` the rows are checked against the canvas at open and can be divided by size (`oversize`, `larger_than`) into arrays with tight canvases; `count` pins the number of planes.
formats: [tiff]
containers: [http]
params:
  column: {type: str, required: true, doc: "the CSV column (by its header) that holds each file's name, e.g. `name`. A name may hold letters, digits and ._~- only; anything else raises. The selected rows are ordered by this name (as strings) and become the z planes; reason required in binding"}
  files: {type: str, required: true, doc: "the path of a row's file relative to the folder of the manifest, with {name} once where the row's name goes, e.g. 'images/{name}.tif' for the raw and 'masks/{name}.tif' for its labels. No '..', no leading '/', no scheme: the files are below the manifest's folder; reason required in binding"}
  canvas: {type: list, required: true, doc: "[height, width] of every plane, at least the largest height and width among the array's files (from the manifest's shape column, or measured). A file sits unchanged at the top left of its plane (file pixel (y, x) is plane pixel (y, x)) and the rest of the plane is 0. A file larger than the canvas raises (at open with `shape_column`, else at read); nothing is cropped. A raw and its labels take the same canvas; reason required in binding"}
  where: {type: dict, required: false, doc: "{column: value} or {column: [values]}: only the rows whose cell in each named column is the value (one of the values), compared as text, are read, e.g. {domain: malnio}. Give a raw and its labels the same; reason required in binding"}
  shape_column: {type: str, required: false, doc: "the CSV column that holds each file's shape as text: '(h, w)', '(h, w, samples)', '[h, w]' or 'hxw'; height and width are the first two numbers. With it the canvas is checked against every selected row at open, and every file is checked against its row at read (another height or width raises). Needed by `oversize` and `larger_than`; reason required in binding"}
  oversize: {type: str, required: false, doc: "'skip': rows whose shape does not fit the canvas are left out instead of raising, for an array that holds the smaller files of a manifest while another array (with `larger_than` this canvas) holds the rest. Needs `shape_column`; pin the result with `count`; reason required in binding"}
  larger_than: {type: list, required: false, doc: "[height, width]: only rows whose shape does NOT fit in it (taller than height or wider than width) are read, i.e. the files an array with that canvas and `oversize: skip` leaves out. Needs `shape_column`; reason required in binding"}
  count: {type: int, required: false, doc: "the number of planes the array must have after `where`, `oversize` and `larger_than`. Open fails on another number, so a changed manifest is noticed instead of shifting z; reason required in binding"}
requires: [numpy, tifffile, imagecodecs]
tested_on: [hf-toxoplasma-plaque-assay-masks]
supersedes: null
