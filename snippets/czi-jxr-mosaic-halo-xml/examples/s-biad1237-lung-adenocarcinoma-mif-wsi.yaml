    urls:
      - "https://ftp.ebi.ac.uk/biostudies/fire/S-BIAD/237/S-BIAD1237/Files/Nrf2%20lung%20cancer/iCAIRD_L122.annotations"
      - "https://ftp.ebi.ac.uk/biostudies/fire/S-BIAD/237/S-BIAD1237/Files/Nrf2%20lung%20cancer/iCAIRD_L122.czi"
