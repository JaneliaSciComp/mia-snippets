reasons:
  - "urls: only the record's technical.sample pair, iCAIRD_L122.czi (the smallest slide, 8.1 GB) and iCAIRD_L122.annotations. The other 161 slides have the same layout by the record and can be bound the same way, one raw and one label each; they were not read here, so they are not claimed"
  - "raw with czi-jxr-mosaic-halo-xml, no params: the CZI holds 7990 full-resolution subblocks (5 channels x 1598 tiles, Gray16, JPEG XR, 2236x2236 except the last column and row) on a grid without overlap that starts at pixel 0, 0, which the snippet places at the directory's positions: cyx 5x75745x104298 uint16, the record's shape and the XML's SizeX/SizeY. Channels in file order: DAPI, Fcein, Cy3, Cy5, AF750. czi-mosaic-imagej-roi, the draft's snippet, refuses JPEG XR tiles"
  - "the pixels are what the JPEG XR tiles decode to; the record's 'CompressionMethod None, OriginalCompressionMethod JpgXr' reads as if the file were uncompressed, but every subblock of this file is JPEG XR, a lossy codec as ZEN uses it"
  - "voxel size 227 nm from the CZI's Scaling metadata, the record's value"
  - "label urls are the .annotations file and the raw CZI again: the HALO XML holds coordinates only, so the snippet reads the CZI's header and directory for the shape and voxel size of the grid the polygons are filled onto; no CZI pixel is read for the label"
  - "layers [Stroma, Tumour]: id 1 is stroma and id 2 is tumour, the two tissue classes of the record. The file's third layer, 'Layer 1' (3 polygons), is the analysed area and not a class, so it is left out; 0 is everything else: outside the analysed area, and inside it the pixels the classifier gave neither class (about a third of the analysed area in a sample of rows)"
  - "holes: a pixel is in a layer when more of the layer's positive regions than of its NegativeROA=1 regions enclose it. On 24 bands of 32 rows across the annotated area this makes the two layers a partition: tumour sits in holes of stroma (1.7 M pixels) and stroma in holes of tumour (94 k), stroma islands lie inside stroma holes (103 k, which 'any negative region excludes' would lose), and 29 pixels are in both layers"
  - "coordinate frame, which the record leaves open: vertex X, Y are taken as pixels of the stitched mosaic, x right and y down from its corner. Checked on two 1024x1024 windows (2.1 M labelled pixels): the AF750 channel is 3.68 times brighter inside Tumour than inside Stroma at the stated position, 3.50 to 3.56 with the label moved 15 px in any direction, 2.90 to 3.13 at 40 px, 1.75 to 1.94 at 120 px, 1.14 to 1.23 at 240 px, and 0.82 to 1.23 with x, y or both mirrored. The tiles of this file start at 0, 0, so 'canvas corner' and 'absolute tile position' are the same frame here; the snippet refuses a label on a CZI where they differ"
  - "label_key auto_pred-tumour_stroma-semantic and segmentation_type semantic, as the match agent intended: the polygons are the output of a HALO tissue classifier (annotations.source automatic), two class ids, not instances"
  - "which stain the AF750 channel carries is not stated in the file; its contrast between the classes fits pan-cytokeratin, the tumour mask marker (my reading, not the file's)"
