name: tiff-zip-member-3
spec_version: 1
summary: One TIFF from a zip member or a plain URL; deflated members are fetched whole. As tiff-zip-member-2 (`axes`, `channel`, `z_first`/`z_last`), plus `y_first`/`y_last` to present only a run of the page's rows, for a micrograph whose page also holds an instrument data bar (a settings table or a scale bar band) above or below the image.
formats: [tiff, ome-tiff]
containers: [zip, http]
params:
  axes: {type: str, required: false, doc: "override when the TIFF's own axes are wrong: one czyx letter per axis of tifffile's series[0] after size-1 axes (other than y/x) are dropped, including a c that `channel` collapses; reason required in binding"}
  channel: {type: int, required: false, doc: "0-based index on the file's channel axis (tifffile C or S) of the one channel to present; the array then has no c axis. Without it a channelled file keeps its c axis; reason required in binding"}
  z_first: {type: int, required: false, doc: "0-based index of the file's z plane that becomes plane 0 of the array; planes before it are left out. Without it the array starts at the file's first plane. Give a raw and its label the same z_first and z_last; reason required in binding"}
  z_last: {type: int, required: false, doc: "0-based index of the file's z plane that becomes the array's last plane (included); planes after it are left out. Without it the array ends at the file's last plane; reason required in binding"}
  y_first: {type: int, required: false, doc: "0-based index of the page's row that becomes row 0 of the array; rows above it are left out (a data bar above the image). Without it the array starts at the page's first row. Give a raw and its label the same y_first and y_last; reason required in binding"}
  y_last: {type: int, required: false, doc: "0-based index of the page's row that becomes the array's last row (included); rows below it are left out (a data bar below the image). Without it the array ends at the page's last row; reason required in binding"}
requires: [numpy, tifffile, imagecodecs]
tested_on: [gnode-s4bsnu-synaptic-vesicles-tem]
supersedes: tiff-zip-member-2
