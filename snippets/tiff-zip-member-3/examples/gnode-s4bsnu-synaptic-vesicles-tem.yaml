reasons:
- 'tiff-zip-member-3, one raw entry per image (87, images/images/image_01..87.TIF from harness list of
  the record''s download_url): the images are independent 2D micrographs whose shape varies (record shape_varies:
  78 are 2048x2048 as bound here, 9 are 1336x2004) and whose pixel size differs per image (record notes),
  so they are not stacked along z; one entry per file adds no fill and keeps each file''s own calibration'
- 'y_last 2047 on 78 entries (every file whose page has more than 2048 rows): rows 2048 and below are
  an instrument data bar, not specimen. All 87 pages were read whole. The 53 OME-TIFF files (49 with a
  2087x2048 page, 4 with 2093x2048: image_84..87) declare SizeY 2048 in their OME-XML, and below it hold
  a row of constant 0 and then a white table (Operator, Image, Date, Specimen, Magn, HV) with a scale
  bar. The 25 files with a 2115x2048 page (23 ImageJ, 2 plain TIFF: image_42 and image_78; no OME size)
  hold rows 2048-2062 of constant 0, a white scale bar with its label on black in rows 2063-2100, and
  rows 2101-2114 of constant 0. In all 78, row 2047 is specimen and row 2048 is the first constant row
  of the page. tiff-zip-member-2 read the whole page, so a crop near the bottom showed that bar: the uniform
  black band with a sharp edge that the reviewer doubted is the black bar of a 2115-row file. The 9 files
  with a 1336x2004 page (image_66..73 and image_77, ImageJ) have no constant row and specimen to the last
  row, so they take no params'
