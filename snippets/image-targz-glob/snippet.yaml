name: image-targz-glob
spec_version: 1
summary: One image per member (PNG or JPEG, told apart by magic bytes) from the members of tar.gz archives chosen by glob, stacked along z; a colour member's samples are a c axis (zcyx), and with the param `palette` set to `index` a palette PNG is its stored indices (an indexed class or instance mask). Each url is a tar.gz, or a zip wrapping tar.gz files as Dataverse's bundle download sends it, staged whole.
formats: [png, jpeg]
containers: [http, s3, zip]
params:
  members: {type: str, required: true, doc: "glob over the tar member names (fnmatch syntax, case-sensitive; `*` also crosses `/`), e.g. ZT80_38_A/ZT80_38_A_*.jpg; applied to every url's archives. The matches of one url are sorted by member name, the urls concatenated in binding order"}
  palette: {type: str, required: false, doc: "'index': a palette (indexed-colour) PNG member is returned as its stored palette indices, uint8 with no c axis (the ids of a mask saved as an indexed PNG), never as the palette's colours. Without it a palette PNG raises; reason required in binding"}
requires: [numpy, imagecodecs]
tested_on: [harvarddv-ocycmp-prostate-tma-gleason]
supersedes: null
