    segmentation_type: instance
reasons:
  - "raws by platform and split folder (record layout: IncuCyte and microscope, each train/val/test), as in the draft: the two platforms have different yx shapes (2496x2496 and 1080x1920) and each VIA JSON annotates the JPEGs of its own split folder. Globs are anchored at training-data/<platform>/<split>/ so the __MACOSX sidecars are not matched"
  - "nine raws instead of the draft's six: all nine JSON files were read while testing, and three splits have JPEGs without an entry in any JSON of their folder: IncuCyte/val 48 of 144 (all 24 hours of wells VID1320_A6 and VID1320_A7), microscope/train 69 of 264 and microscope/val 28 of 117 (Aufnahme-42xx / -45xx series). Each of these splits is bound as two raws with explicit member urls, in name order: the annotated JPEGs (raws 1, 4, 6; 96, 195 and 89 files, paired with a label) and the JPEGs without an entry (raws 2, 5, 7; no label). IncuCyte/train (raw 0, 336), IncuCyte/test (raw 3, 50) and microscope/test (raw 8, 50, no JSON in the zip) stay globs. Together the raws hold all 961 JPEGs once"
  - "NEEDS A HUMAN DECISION, missing: skip on labels of raws 1, 4 and 6 instead of an all-background plane: the JPEGs without an entry are whole wells and whole acquisition series of the same experiments, and the JSON files are Jupyter checkpoint copies (.ipynb_checkpoints/*-checkpoint.json; the via_region_data.json files themselves are not in the zip), so a missing entry means not annotated in this copy, not no spheroid. A background plane would state the opposite. If the unlabeled raws 2, 5, 7 (and 8) are not wanted beside labeled ones, drop them; the labeled raws do not change"
  - "images: '../*.jpg' on every label: the JSON files are in <split>/.ipynb_checkpoints/ and the JPEGs they name are in <split>/ (record alignment_notes; every filename of every entry is a JPEG of the parent split folder). The snippet takes each plane's grid from the header of its JPEG and orders planes by image name, the order image-tiles-glob gives the raw; while testing, the label planes' image urls were compared with the paired raw's urls and are the same lists"
  - "count on every label (336, 96, 50, 195, 89): the number of annotated JPEGs found while testing, so a changed zip or JSON fails at open instead of shifting z against the explicit raw lists"
  - "NEEDS A HUMAN DECISION, microscope/train label: urls is the glob of the folder's 5 JSON files with duplicates: last. data-checkpoint.json is a list of 244 entries, the number the four via_region_data*-checkpoint.json mappings hold together (17 + 83 + 38 + 106), with file names repeated; all five name 195 distinct JPEGs. Most repeated entries are equal copies and merge. For 17 JPEGs the first and the last entry read differ (one more has a differing copy in between): the same single spheroid outlined twice, in the six looked at once in via_region_data_1 and again, redrawn, in via_region_data_3 and via_region_data. The two outlines of each of the 17 overlap with IoU 0.93 to 0.98 (rasterised while testing), so they are one object and a union would count it twice. duplicates: last reads the files in name order (data, via_region_data, _1, _2, _3) and keeps the last entry read; duplicates: first would give the other outline. The files do not say which the authors trained on"
  - "microscope raws: samples: grey as in the draft, because record imaging.channels is 1 and its notes say the microscope JPEGs are grey stored as RGB with identical samples; the snippet raises if samples differ. IncuCyte raws: no samples param, read as zcyx with the 3 RGB samples as c (record axes yxs; the draft's smoke with samples: grey failed with 'samples differ')"
  - "label_key manual_gt-spheroid-instance, segmentation_type instance, as in the draft: hand-drawn polygons, region_attributes name 'spheroid' on every region of the nine files, one id per polygon; the five labels hold 809 polygons (1 to 4 per image, numbered within each image; 0 is background)"
  - "no voxel size bound: none in the JPEGs or the JSON (record voxel_size_nm null)"
