reasons:
  - "jpeg-zip-glob-points-csv instead of the draft's jpeg-zip-glob: the draft bound no labels because no catalog snippet reads a CSV points table. This snippet reads the same JPEG members the same way (one image per z plane in member-name order, RGB samples as c) and also paints the table's points on that z stack, so raws and labels come from one snippet and one member order"
  - "glob anchored at the image folder of each zip (nov2021/nov2021_images/, mar2020/mar2020_images/, from the zips' listings), so the two CSVs in *_docs are not matched; the label arrays take the same glob as their raw, which is what makes z index k of a label the points of z index k of its raw"
  - "two raws, one per field-visit zip (the draft's choice): zcyx (2280, 3, 3024, 4032) and (2088, 3, 3024, 4032), the record's 2,280 and 2,088 images; each is a z stack of independent 2D fields, not a volume (record dimensionality 2D); all three RGB samples kept as c (record channels 3). Brightfield and darkfield images alternate along z: file names end _<contrast>.jpg and, in the images looked at while testing, contrast 2 has a bright background (brightfield) and contrast 0 a dark one (darkfield)"
  - "table 'nov2021/nov2021_docs/nov2021_annotations_*.csv' and 'mar2020/mar2020_docs/mar2020_annotations_*.csv': each matches the one annotation table of its zip (nov2021_annotations_08262024.csv, 1,623 rows; mar2020_annotations_08262024.csv, 7,460 rows; the match agent could not list the mar2020 name, the listing gives it now) and not the *_patients_list_* CSV beside it. Both tables were read in full while testing: columns imageName, objectType, xCoord, yCoord; every imageName is an image of its zip (368 and 477 annotated images, the others are empty planes); every point lies inside 4032x3024; the S.haematobium rows per image equal numberEggs in the patients list for all 4,368 images"
  - "coordinates read as x = column, y = row of the JPEG as libjpeg decodes it (the one header looked at, mar2020_001_0_0.jpg, is JFIF with no EXIF block, so there is no orientation to apply): crops around points of nov2021_001_1_0/_1_2 and mar2020_051_1_2 show the point on the centre of an egg. Whether the numbers are 0- or 1-based is not stated; they are used as 0-based indices, a possible one-pixel shift against eggs about 100 x 50 pixels in size"
  - "radius 12: the table gives one point per object, not an outline, so each point is painted as a disc of 12 pixels radius (25 pixels across). That is a marker that stays inside the egg (about 100 x 50 pixels in the crops looked at, 110-170 x 40-70 um at the record's ~1 um/pixel), large enough to see in a 256-pixel crop. Discs of points closer than 24 pixels touch (7 pairs in nov2021 and under 120 in mar2020 are closer than 40 pixels) and a shared pixel goes to the nearer point"
  - "NEEDS A HUMAN DECISION, points as two labels per raw: the record's encoding is points-table, which has no segmentation_type and no label-key kind (the draft's key ended -points). Chosen so that nothing in the table is lost and nothing uncertain is called an egg: label instance with classes [S.haematobium] and skip [doubtful] numbers the certain eggs of each image (segmentation_type instance, label_key manual_gt-schistosoma_haematobium_egg-instance); label semantic with classes [S.haematobium, doubtful] carries the objectType, 1 = S.haematobium egg, 2 = doubtful object (segmentation_type semantic, label_key manual_gt-schistosoma_haematobium_egg-semantic). Both are point markers, not egg masks: a consumer must not take the discs for outlines"
  - "label_key source manual_gt and class schistosoma_haematobium_egg from the draft (annotations.source manual, record class 'Schistosoma haematobium egg')"
  - "voxel size: the snippet reports None (JPEG carries none); the record's 1000 nm x/y is from the paper"
