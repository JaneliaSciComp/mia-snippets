name: jpeg-yolo-boxes-2
spec_version: 1
summary: A set of 8-bit JPEG or PNG images (RGB samples kept as c; a file is read as what its first bytes say it is, so a PNG named .jpg is read), or of the YOLO box tables that belong to them (one .txt per image, rows `class x_center y_center width height` as fractions of the image) rasterised on the grid of the image with the same file name stem, from zip members or an HTTP directory chosen by glob (or plain URLs), one image per z plane. jpeg-yolo-boxes plus PNG content, `overhang` (a box may reach a few pixels past the image edge and is clipped) and an Exif orientation of 0 read as no orientation. A label array's urls are its raw's image urls plus the tables' urls, so its planes follow the raw's order. An empty table is an all-background plane. Images are returned as stored; `drawn_on` says whether boxes of an image with an Exif orientation of 2..8 are fractions of the displayed or the stored picture.
formats: [jpeg, png, other]
containers: [zip, http]
params:
  boxes: {type: str, required: false, doc: "label arrays only, and required for them: how the boxes are painted on the yx grid. 'instance' fills each box with its 1-based row number in its table; 'semantic' fills it with its class id + 1. 0 is background; where boxes overlap the smaller one is on top. Reason required in binding"}
  classes: {type: list, required: false, doc: "label arrays only, and required for them: the class names in class id order, the first is id 0 (semantic value = id + 1 = position in this list, from 1). A row whose class id is past the list raises, in both modes. Reason required in binding"}
  drawn_on: {type: str, required: false, doc: "label arrays only: what the box fractions are fractions of when an image has an Exif orientation of 2..8. 'displayed': the picture as a viewer shows it, orientation applied (what an annotation tool shows); the boxes are turned back onto the stored pixels, which is what the image array returns. 'stored': the stored pixel grid. Without it a table with boxes whose image is turned raises. An image without the tag, or with 0 or 1, is the same either way. Reason required in binding"}
  overhang: {type: int, required: false, doc: "label arrays only: how many pixels a box may reach beyond the image edge; such a box is clipped to the image. Default 0: a box that leaves the image raises, since it may be drawn on another grid. Set it to the largest overhang found in the files; reason required in binding"}
  count: {type: int, required: false, doc: "the number of images (z planes) the array must have, from a complete listing. Open fails on another number, so a changed listing is noticed instead of shifting z; reason required in binding"}
requires: [numpy, imagecodecs]
tested_on: [figshare-22679839-smartmalarianet-thin-smear-detection]
supersedes: jpeg-yolo-boxes
