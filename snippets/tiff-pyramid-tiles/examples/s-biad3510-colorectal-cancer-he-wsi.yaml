reasons:
  - "tiff-pyramid-tiles instead of the draft's tiff-zip-member-2: the slides are tiled, JPEG-compressed pyramidal TIFFs (record technical.arrays: yxs 44544x47616x3 uint8 for the smallest, files up to 3.4 GB), and every other TIFF snippet decodes a whole page per read, 6.4 GB for the smallest slide. This one fetches and decodes only the 512x512 JPEG tiles a crop overlaps (access chunk)"
  - "one plain url per slide, each slide its own raw: slide shapes differ (record shape_varies: true; harness smoke reports 44544x47616, 80896x121856, 100352x115712 and 94208x119808 for the four bound), so slides cannot be stacked into one array. Plain urls rather than the slides/ glob with params.index, so that a changed listing cannot move a binding to another slide"
  - "four of the 2,502 slides are bound, not all: opening a slide costs 2 MiB (the header block and the block holding page 0's IFD, which follows its tiles) and two slow requests, so opening all 2,502 is about 5.2 GB and hours before the first crop, over the job's 5 GB cap. Bound are the record's sample slide (tumour 159, A2020-000159_1-2-1, the smallest file) first, and the first slide in the listing of tumours 1, 500 and 1000 (the first, middle and last tumour IDs). More slides are bound the same way, one url each"
  - "level not set (page 0): page 0 is the full-resolution image the record describes (0.25 um/px); pages 1-7 are its 2x-reduced copies (SubFileType 1, record alignment_notes) and would be bound with params.level and the voxel size scaled by 2^level"
  - "axes cyx, c = 3: the TIFF's sample axis as c, R, G, B in order after the JPEG decoder's YCbCr to RGB conversion; the samples differ (H&E colour, record alignment_notes), so they are not collapsed"
  - "no labels: the record's only annotation is Clinical_annotation.csv, a tumour-level table (encoding: other), not a pixel array"
  - "no voxel size from the file: it has no resolution tags (harness describe); the record's 250 nm in x and y applies to page 0"
