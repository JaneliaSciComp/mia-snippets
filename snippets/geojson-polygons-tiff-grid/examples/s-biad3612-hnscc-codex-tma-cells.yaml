reasons:
  - "urls: one core only, Core_A5, the record's technical.sample. The other 27 cores under images/cores/ (shape varies per core) can be bound the same way, one raw and its Core_<id> GeoJSON labels each, paired by the Core_<id> in the file names as the record's alignment_notes say; they were not read here, so they are not claimed. Core_A2_tumor_boundary.geojson is 0 bytes by the record: leave Core_A2's tumor label out (the snippet refuses a 0-byte file unless empty_ok is set, and an empty file does not say the core has no tumour)"
  - "raw: tiff-zip-member-2 at the plain URL, no params, as in the match agent's draft (its smoke of the raw passed: cyx 77 x 4493 x 4720 uint16, 506.7 nm). It is slow to open, about 45 minutes, because it walks all 77 page headers; that is the raw snippet's cost and is not changed here"
  - "labels with geojson-polygons-tiff-grid: each label's urls are the GeoJSON and the raw OME-TIFF again. A GeoJSON holds coordinates only, so the snippet reads the first page header of the TIFF (about 1 MiB) for the 4493 x 4720 grid and the 506.7 nm pixel size; no TIFF pixel is read for a label"
  - "coordinate frame: GeoJSON coordinates are taken as pixels of the paired core image (QuPath's frame, integer = pixel corner), which the record states (same-grid). The polygons of both Core_A5 files lie inside the 4720 x 4493 grid (tumor polygons span x 296..4480, y 128..4464), and the snippet fails a read whose polygons leave the grid by more than a pixel"
  - "label 0, auto_pred-cell-instance: default member geometry, the cell outline of each QuPath cell object (InstanSeg, automatic). Instance ids are the feature's 1-based position in the file, uint32"
  - "label 1, auto_pred-nucleus-instance: member nucleusGeometry, the nucleus outline stored in the same feature, so a nucleus has the id of its cell in label 0. Cell objects without a nucleusGeometry are left out of this label"
  - "drop_classes [Not_cells] on labels 0 and 1, to be confirmed by a human: every object is classified Cells or Not_cells by the authors, and the label keys say cell and nucleus, so only what the authors call cells is labelled. This removes about half of the segmented objects, and the dataset's README does not say what the classifier separates. The two classes do not differ in size and many Not_cells objects have a nucleus outline (numbers in the snippet README, Tested on), so they are not obviously debris; if they are cells of another kind, remove drop_classes and the label holds every segmented object"
  - "label 2, auto_pred-tumor-semantic: binary true, segmentation_type binary. The file holds QuPath annotation polygons, all classified TUMOR, from a pixel classifier; they are regions, not objects, so they are filled as one mask rather than as ids"
  - "label dtypes uint32 and uint8 are the snippet's own; the record has none for polygons (dtype unknown), so smoke warns about them"
