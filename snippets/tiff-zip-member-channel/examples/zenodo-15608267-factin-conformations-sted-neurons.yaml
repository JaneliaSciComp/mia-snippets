reasons:
  - "one image/mask pair (d9c691d4), the pair record.yaml samples: the other 78 member names are uuids not listed in the record, and both snippets take exactly one url per array"
  - "raw with tiff-zip-member: a single-page ImageJ TIFF, yx 512x512 uint16 (record technical.arrays), axes from the file, no override"
  - "labels with tiff-zip-member-channel instead of tiff-zip-member: the mask is an ImageJ hyperstack cyx 3x512x512 uint16 whose three channels are three separate binary masks; tiff-zip-member exposes c and the harness reads c=0 only of a channelled label paired with a channel-less raw, so compact assemblies and protrusions would never reach a crop. The same file is bound three times, once per channel, each as a yx binary label"
  - "channel 0 / 1 / 2 = nanoclusters / compact assemblies / protrusions: the record's classes (annotations.format, from the harvest); the files do not name their channels"
  - "label_keys manual_gt-nanocluster-semantic, manual_gt-compact_assembly-semantic, manual_gt-protrusion-semantic: annotations.source manual, one key per class; encoding binary folds to semantic in the key"
  - "segmentation_type binary for all three: each channel is a {0,1} mask (value_range 0..1, encoding binary)"
  - "not channels: onehot (one class map): in 16 of the 79 masks the channels overlap (up to 387 pixels, e.g. nanoclusters inside protrusions), so argmax class ids would drop information and the one-hot check would raise on those files; per-channel binary labels keep every class"
