reasons:
- 'png-image instead of image-tiles-glob or png-channels: the CWRU, CINJ and TCGA masks are 1-bit greyscale PNGs, which both of those refuse; png-image returns their stored values 0/1 as uint8'
- 'one raw and one label entry per slide instead of a glob: the slides differ in size (17 distinct shapes among the 17 bound images, e.g. [3, 1328, 2344] and [3, 2886, 3752]), an array has one shape and a reader does not pad, so each PNG is its own 2D array; png-image reads only the PNG header at open'
- '17 of the 584 slides are bound, the pairs whose image and mask have the same height and width among the first 12 by name of each cohort, at most 6 per cohort (6 CWRU, 2 CINJ, 3 TCGA, 6 HUP): opening an array costs one range request per image, and when every pair was opened in one run zenodo.org answered 429 TOO MANY REQUESTS after about 110 requests in 20 s (all 110 CWRU pairs had opened by then, 109 images compared with their masks, none differing in size); the harness does not retry a 4xx, so a cold job over all 584 slides would fail at open. The other slides bind the same way'
- 'label i pairs_with raw i, matched by slide id in the file names (record alignment_notes): CWRU: CWRU_masks/AS12-2494 a2_201305171102.png with CWRU_imgs_idx8/AS12-2494 a2_201305171102.png; CINJ: CINJ_masks_HG/10259.png with CINJ_imgs_idx5/10259_idx5.png; TCGA: TCGA_masks/TCGA-A2-A04N-01Z-00-DX1.9E9B7DB0-1CF1-4631-8292-A9DBCA0BD37C.png with TCGA_imgs_idx5/TCGA-A2-A04N-01Z-00-DX1.9E9B7DB0-1CF1-4631-8292-A9DBCA0BD37C.png; HUP: HUP_masks/12241_annotation_mask.png with HUP_imgs_idx5_Part_1/12241_idx5.png'
- 'left out because the mask''s size differs from its image''s and a reader does not crop: CINJ 10253 (image [2230, 2731], mask [2231, 2732]); CINJ 10254 (image [2021, 2551], mask [2021, 2552]); CINJ 10255 (image [2238, 2401], mask [2239, 2402]); CINJ 10256 (image [1853, 2431], mask [1854, 2432]); CINJ 10257 (image [2504, 2551], mask [2504, 2552]); CINJ 10258 (image [2293, 2791], mask [2294, 2792]); CINJ 10260 (image [1964, 2912], mask [1965, 2912]); CINJ 10261 (image [2014, 2671], mask [2014, 2672]); CINJ 10264 (image [2181, 2791], mask [2182, 2792]); CINJ 10268 (image [2410, 3932], mask [2410, 3933]); TCGA TCGA-A1-A0SD-01Z-00-DX1.DB17BFA9-D951-42A8-91D2-F4C2EBC6EB9F (image [2508, 2939], mask [2509, 2940]); TCGA TCGA-A1-A0SE-01Z-00-DX1.04B09232-C6C4-46EF-AA2C-41D078D0A80A (image [2291, 3839], mask [2292, 3840]); TCGA TCGA-A1-A0SJ-01Z-00-DX1.C196FA66-C376-4016-86BC-3D8E745B3A51 (image [2797, 3389], mask [2797, 3390]); TCGA TCGA-A1-A0SM-01Z-00-DX1.AD503DBD-4D93-4476-B467-F091254FDF78 (image [2515, 3149], mask [2516, 3150]); TCGA TCGA-A2-A04R-01Z-00-DX1.BE3661A3-A2A0-4248-B7D5-D8986E529B6C (image [2076, 2782], mask [2077, 2783]); TCGA TCGA-A2-A04V-01Z-00-DX1.EB430DDB-8FE9-4302-8829-53DBAD09E79F (image [1371, 2040], mask [2743, 4081]); TCGA TCGA-A2-A04Y-01Z-00-DX1.4DC97AD6-4806-4A3A-A998-FD36F93590A4 (image [2074, 2910], mask [2075, 2910]); TCGA TCGA-A2-A0CP-01Z-00-DX1.ECFD263C-BB17-4ADA-8F2C-654C2AA4C45F (image [1865, 2154], mask [1865, 2155]); TCGA TCGA-A2-A0CQ-01Z-00-DX1.4E5FB4E5-A08C-4C87-A3BE-0640A95AE649 (image [667, 2169], mask [1334, 4339])'
- 'raw: no params; the images are 8-bit RGB with real colour (H&E), so the samples stay a c axis and each raw is cyx (3, Y, X)'
- 'labels of CWRU, CINJ and TCGA: no params; 1-bit greyscale, read as yx with values 0 (background) and 1 (invasive cancer)'
- 'labels of HUP: samples grey, because the HUP masks are RGB PNGs whose three samples are identical copies with values 0 and 255 (record alignment_notes); png-image checks that at read and returns sample 0 as yx'
- 'label_key manual_gt-invasive_cancer-semantic (from the draft): manual annotation, class ''invasive cancer'' (record classes), one class against background; segmentation_type binary, so 1 and 255 both mean foreground'
