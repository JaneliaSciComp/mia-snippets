reasons:
  - "raw: the 22 MRC micrographs that harness list shows in sample_data/micrographs/ (EMPIAR-10033, each 4096x4096 float32, one section), one array per file because mrc-http-3 takes exactly one URL per array; unchanged from the draft. All other micrographs are only inside the per-EMPIAR tar.gz archives, which no catalog snippet reads"
  - "labels with csv-points-mrc-grid: the record's label array is a points table, one CSV per micrograph in sample_data/ground_truth/particle_coordinates/ with the micrograph's stem (X-Coordinate, Y-Coordinate, Diameter, Angle-Psi, origin offsets, CTF columns; one row per particle). Each of the 22 micrographs has its CSV (16 to 134 rows, 1721 particles in all, whole-number coordinates), so there are 22 labels, label i paired with raw i by the shared file stem"
  - "urls of each label: the CSV, then the micrograph of raw i. The snippet reads that micrograph's 1024-byte header for the grid (nx, ny, one section), so each label is zyx 1x4096x4096 like the array mrc-http-3 opens and every centre is checked to lie on it"
  - "y_axis: up, against the record's plain 'X-/Y-Coordinate columns in micrograph pixels': the table's Y counts rows from the last stored row of the MRC (row = 4095 - Y), not from the first. Measured on two micrographs (..._224220 and ..._234508, 67 and 134 particles): the raw averaged around the centres read with y up is a dark particle of about 110 px radius inside a bright fringe; read with y down, or with x mirrored or x and y swapped, the average is flat (figures in the snippet's README). Whether the row is 4095 - Y or 4096 - Y cannot be told from particles this wide"
  - "radius not set: each particle is its centre pixel, which is all the table states as a position. The Diameter column (350 in every row of the 22 files) is not the particle's width in pixels (the particles measure about 220-260 px across) and its unit is not given, so no disc of that size is drawn. A human who wants a visible mark instead of single pixels can set radius; it is a mark size, not an outline"
  - "label_key manual_gt-virus_particle-points with segmentation_type instance: the record's encoding is points-table (kind points) and the dataset paper describes the picks as manually curated; the binding schema has no points type, and instance is the one that keeps what the label holds, a distinct id per particle (its 1-based row in the CSV, restarting in every file). Read as binary it would be 'a particle centre is here'"
  - "coverage: the CSVs hold the selected particles only (sample_data/ground_truth/ also has an 'excluded' export and false_positives/, not bound), so background 0 means 'no selected particle centre', and all but one pixel of each particle is background"
  - "the label dtype warning is expected: the record gives the CSV's dtype as 'unknown'; the rasterised ids are uint16"
  - "voxel size: none. The MRC headers have cell size 0 and the table has no pixel size (the record says the same)"
