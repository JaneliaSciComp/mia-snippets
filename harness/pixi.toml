[workspace]
name = "mia-harness"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
numpy = "*"
tifffile = "*"
imagecodecs = "*"
mrcfile = "*"
h5py = "*"
pypng = "*"
httpx = "*"
pyyaml = "*"
pydantic = ">=2"

[pypi-dependencies]
mia-harness = { path = ".", editable = true }

[feature.test.dependencies]
pytest = "*"

[environments]
default = ["test"]

[tasks]
test = "pytest tests/"
