name: check
on: pull_request
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install pyyaml
      - run: python ci/check_pr.py --author "${{ github.event.pull_request.user.login }}"
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: harness/pixi.toml
      - run: pixi run test
        working-directory: harness
