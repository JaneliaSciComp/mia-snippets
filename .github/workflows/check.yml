name: check
on: pull_request
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install pyyaml
      # run the checker as it is on main, so a PR cannot edit ci/ to neuter its own check
      - run: git show origin/main:ci/check_pr.py > "$RUNNER_TEMP/check_pr.py"
      - run: python "$RUNNER_TEMP/check_pr.py" --base origin/main --author "${{ github.event.pull_request.user.login }}"
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: harness/pixi.toml
      - run: pixi run test
        working-directory: harness
      - run: pixi run ci-test
        working-directory: harness
